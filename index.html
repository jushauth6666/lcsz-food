<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>龙巢食品ERP · 后台管理</title>
<style>
:root{--bg:#f1f5f9;--panel:#fff;--panel2:#f8fafc;--text:#0f172a;--sub:#64748b;--mute:#94a3b8;--bd:#e2e8f0;--bd2:#eef2f7;--pri:#2563eb;--pri2:#1d4ed8;--priSoft:#eff6ff;--ok:#10b981;--okSoft:#ecfdf5;--warn:#f59e0b;--warnSoft:#fffbeb;--danger:#ef4444;--dangerSoft:#fef2f2;--info:#0ea5e9;--infoSoft:#f0f9ff;--sb:#0f172a;--sb2:#1e293b;--sbT:#cbd5e1;--sbS:#f8fafc;--sh:0 1px 3px rgba(15,23,42,.08);--sh2:0 8px 24px rgba(15,23,42,.12);--sh3:0 24px 60px rgba(15,23,42,.22);--r:12px}
body.dark{--bg:#0b1220;--panel:#111a2e;--panel2:#0f172a;--text:#e2e8f0;--sub:#94a3b8;--mute:#64748b;--bd:#1e2a44;--bd2:#172036;--pri:#3b82f6;--priSoft:#122a44;--okSoft:#0d2b23;--warnSoft:#2b2211;--dangerSoft:#2b1215;--infoSoft:#0b2233;--sb:#070d1a;--sb2:#0f172a;--sbT:#94a3b8;--sbS:#f1f5f9}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-size:14px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font-family:inherit}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:264px;flex-shrink:0;background:var(--sb);color:var(--sbT);display:flex;flex-direction:column;transition:width .22s;overflow:hidden}.sidebar.collapsed{width:68px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px;min-height:60px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:34px;height:34px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(59,130,246,.4)}
.brand-txt{overflow:hidden;white-space:nowrap}.brand-txt strong{display:block;font-size:14px;color:var(--sbS)}.brand-txt span{display:block;font-size:11px;opacity:.7;margin-top:1px}.sidebar.collapsed .brand-txt{display:none}
.side-tools{display:flex;gap:6px;padding:10px 14px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06)}
.mini{flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--sbT);border-radius:7px;padding:6px 4px;font-size:11.5px;cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden}.mini:hover{background:rgba(255,255,255,.14);color:#fff}
.sidebar.collapsed .side-tools{justify-content:center;padding:10px 6px}.sidebar.collapsed .mini{flex:none;font-size:15px;padding:6px 10px}.sidebar.collapsed .mini .txt{display:none}
.menu-nav{flex:1;overflow-y:auto;padding:8px 8px 24px;scrollbar-width:thin}.menu-nav::-webkit-scrollbar{width:6px}.menu-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.menu-empty{color:var(--sbT);opacity:.6;font-size:12.5px;padding:24px 12px;text-align:center}

/* ===== 一级菜单：分组卡片 + 渐变左竖条 ===== */
.m1{margin:0 0 6px;border-radius:10px;background:rgba(255,255,255,.04);overflow:hidden;position:relative}
.m1::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#3b82f6,#06b6d4);opacity:0;transition:opacity .2s}
.m1.open::before{opacity:1}
.m1-h{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;color:#fff;
  font-weight:700;font-size:14px;letter-spacing:.2px;transition:background .15s;user-select:none;
  background:linear-gradient(90deg,rgba(59,130,246,.14),rgba(59,130,246,.02))}
.m1-h:hover{background:linear-gradient(90deg,rgba(59,130,246,.26),rgba(59,130,246,.06))}
.m1.open>.m1-h{background:linear-gradient(90deg,rgba(59,130,246,.3),rgba(59,130,246,.08))}
.m1-h .caret{color:#93c5fd;opacity:.9}
.m1-h .mlabel{color:#fff}
.m1-h .mcount{background:rgba(255,255,255,.16);color:#f1f5f9;font-weight:600}

.caret{width:14px;flex-shrink:0;text-align:center;font-size:10px;opacity:.65;transition:transform .18s}
.m1.open>.m1-h>.caret,.m2.open>.m2-h>.caret{transform:rotate(90deg)}
.mlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcount{font-size:10.5px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--sbT);flex-shrink:0}

/* 一级内容区 */
.m1-b{display:none;padding:6px 6px 8px 10px}
.m1.open>.m1-b{display:block}

/* ===== 二级菜单：浅底胶囊 + 左侧描边 ===== */
.m2{margin:4px 0;border-radius:8px}
.m2-h{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;cursor:pointer;
  color:#cbd5e1;font-size:13px;font-weight:600;transition:all .15s;user-select:none;
  background:rgba(255,255,255,.055);border-left:2px solid rgba(255,255,255,.12)}
.m2-h:hover{background:rgba(255,255,255,.12);color:#f8fafc;border-left-color:#3b82f6}
.m2.open>.m2-h{background:rgba(59,130,246,.16);color:#f8fafc;border-left-color:#06b6d4}
.m2-h .mcount{background:rgba(255,255,255,.12);color:#cbd5e1;font-weight:500}

/* 二级内容区：虚线缩进连接 */
.m2-b{display:none;padding:4px 0 6px 4px;margin-left:10px;
  border-left:1px dashed rgba(255,255,255,.16)}
.m2.open>.m2-b{display:block}

/* ===== 三级菜单：透明底，hover / 选中才亮 ===== */
.m3{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;
  color:#94a3b8;font-size:12.8px;transition:all .13s;position:relative}
.m3:hover{background:rgba(255,255,255,.08);color:#e2e8f0}
.m3 .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0}
.m3.active{background:linear-gradient(90deg,rgba(59,130,246,.3),rgba(59,130,246,.06));
  color:#bfdbfe;font-weight:600}
.m3.active .dot{background:#3b82f6;opacity:1;box-shadow:0 0 0 3px rgba(59,130,246,.25)}

/* ===== 折叠状态（保留图标模式） ===== */
.m1-icon{display:none}
.sidebar.collapsed .m1{background:transparent;border-radius:0;margin:2px 0}
.sidebar.collapsed .m1::before{display:none}
.sidebar.collapsed .m1-h{justify-content:center;padding:11px 0;background:transparent}
.sidebar.collapsed .m1-h:hover{background:rgba(255,255,255,.08)}
.sidebar.collapsed .m1-h .mlabel,.sidebar.collapsed .m1-h .mcount,.sidebar.collapsed .m1-h .caret{display:none}
.sidebar.collapsed .m1-icon{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.07);font-size:13px;font-weight:700;color:#e2e8f0}
.sidebar.collapsed .m1-b{display:none!important}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:60px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20}
.icon-btn{width:34px;height:34px;border-radius:8px;flex-shrink:0;border:1px solid var(--bd);background:var(--panel);color:var(--sub);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s}.icon-btn:hover{background:var(--panel2);color:var(--pri);border-color:var(--pri)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);overflow:hidden;white-space:nowrap;min-width:0}.crumb b{color:var(--text);font-weight:600}.crumb .sep{opacity:.4}
.crumb .lnk{cursor:pointer;border-radius:4px;padding:2px 5px;transition:all .15s}.crumb .lnk:hover{background:var(--priSoft);color:var(--pri)}
.top-search{margin-left:auto;position:relative;width:240px;flex-shrink:0}
.top-search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--bd);border-radius:8px;background:var(--panel2);color:var(--text);font-size:13px;outline:none;transition:all .15s}
.top-search input:focus{border-color:var(--pri);background:var(--panel);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.top-search .s-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.user{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:4px 8px 4px 14px;border-left:1px solid var(--bd);cursor:pointer;border-radius:8px;transition:background .15s}.user:hover{background:var(--panel2)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.user-info{line-height:1.25}.user-info strong{display:block;font-size:12.5px}.user-info span{display:block;font-size:11px;color:var(--mute)}
.tabbar{height:42px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:stretch;padding:0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.tabbar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12.8px;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;flex-shrink:0}.tab:hover{color:var(--text);background:var(--panel2)}.tab.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.t-x{width:16px;height:16px;border-radius:4px;border:none;background:transparent;color:inherit;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.5;transition:all .15s}.t-x:hover{background:rgba(0,0,0,.1);opacity:1}
.tabbar-empty{display:flex;align-items:center;font-size:12px;color:var(--mute);padding:0 6px}
.content{flex:1;overflow-y:auto;padding:20px 22px 80px;scroll-behavior:smooth}.content::-webkit-scrollbar{width:9px}.content::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{margin:0 0 6px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.page-head h2 .badge{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--priSoft);color:var(--pri)}
.page-head p{margin:0;font-size:12.8px;color:var(--sub)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:var(--panel);color:var(--sub);padding:7px 14px;border-radius:8px;font-size:12.8px;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}.btn:hover{background:var(--panel2);color:var(--text);border-color:var(--mute)}
.btn-primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btn-primary:hover{background:var(--pri2);border-color:var(--pri2);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}.btn-ok:hover{background:#059669;border-color:#059669;color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}.btn-danger:hover{background:#dc2626;border-color:#dc2626;color:#fff}
.btn-sm{padding:4px 9px;font-size:11.8px;border-radius:6px}.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tb-search{flex:1;min-width:180px;max-width:320px;padding:7px 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--panel2);color:var(--text);outline:none}.tb-search:focus{border-color:var(--pri);background:var(--panel);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.toolbar select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--panel2);color:var(--text);outline:none;cursor:pointer}
.toolbar input[type=date]{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--panel2);color:var(--text);outline:none}
.toolbar input[type=date]:focus{border-color:var(--pri);background:var(--panel);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.toolbar .spacer{flex:1}.toolbar .date-sep{color:var(--mute);font-size:12.5px}
.tbl-wrap{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
.tbl th{background:var(--panel2);color:var(--sub);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:12.5px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd2);vertical-align:middle;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tbody tr{transition:background .12s;cursor:pointer}.tbl tbody tr:hover{background:var(--panel2)}.tbl tbody tr.selected{background:var(--priSoft)}
.tbl tbody tr:last-child td{border-bottom:none}.tbl .empty-row td{text-align:center;color:var(--mute);padding:50px 0;cursor:default}
.tbl .col-check{width:40px;cursor:default}.tbl .col-actions{width:1%;white-space:nowrap;text-align:right;cursor:default}
.tbl input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--pri)}
.actions{display:inline-flex;gap:3px;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.warn{background:var(--warnSoft);color:#b45309}.tag.success{background:var(--okSoft);color:#047857}.tag.danger{background:var(--dangerSoft);color:#b91c1c}.tag.info{background:var(--infoSoft);color:#0369a1}.tag.muted{background:var(--panel2);color:var(--mute)}
body.dark .tag.warn{color:#fbbf24}body.dark .tag.success{color:#34d399}body.dark .tag.danger{color:#f87171}body.dark .tag.info{color:#38bdf8}
.detail-badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--priSoft);color:var(--pri);margin-left:4px;font-weight:600;vertical-align:middle}
.pager{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;border-top:1px solid var(--bd2);font-size:12.5px;color:var(--sub)}
.pager .pages{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.pager .pg{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--bd);background:var(--panel);border-radius:7px;color:var(--sub);cursor:pointer;font-size:12.5px;transition:all .15s}
.pager .pg:hover{border-color:var(--pri);color:var(--pri)}.pager .pg.active{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.pager .pg:disabled{opacity:.4;cursor:not-allowed}
.pager select{padding:5px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--panel);color:var(--text);font-size:12.5px;cursor:pointer}
.hero{background:linear-gradient(120deg,#1d4ed8,#0ea5e9 65%,#06b6d4);border-radius:16px;padding:26px 30px;color:#fff;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 14px 34px rgba(29,78,216,.28)}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;right:70px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{margin:0 0 8px;font-size:22px;font-weight:700;position:relative}.hero p{margin:0;font-size:13.5px;opacity:.92;position:relative;max-width:660px;line-height:1.7}
.hero-actions{display:flex;gap:10px;margin-top:16px;position:relative;flex-wrap:wrap}
.hero-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;cursor:pointer;transition:all .15s}.hero-btn:hover{background:rgba(255,255,255,.3)}
.hero-btn.primary{background:#fff;color:#1d4ed8;border-color:#fff;font-weight:600}.hero-btn.primary:hover{background:#eff6ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px;transition:all .18s}.stat:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.stat-ico{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px}
.s-blue{background:#eff6ff;color:#2563eb}.s-green{background:#ecfdf5;color:#059669}.s-amber{background:#fffbeb;color:#d97706}.s-violet{background:#f5f3ff;color:#7c3aed}
body.dark .s-blue{background:#122a44;color:#60a5fa}body.dark .s-green{background:#0d2b23;color:#34d399}body.dark .s-amber{background:#2b2211;color:#fbbf24}body.dark .s-violet{background:#231a3d;color:#a78bfa}
.stat-num{font-size:22px;font-weight:700;line-height:1.1}.stat-label{font-size:12px;color:var(--sub);margin-top:3px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.section-title h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title h2::before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(#3b82f6,#06b6d4)}
.section-title .sub{font-size:12px;color:var(--mute);font-weight:400;margin-left:4px}
.l1-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.l1-card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:all .18s;box-shadow:var(--sh);position:relative;overflow:hidden}
.l1-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(#3b82f6,#06b6d4);transform:scaleY(0);transform-origin:top;transition:transform .22s}
.l1-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:rgba(59,130,246,.4)}.l1-card:hover::after{transform:scaleY(1)}
.l1-card h3{margin:0 0 8px;font-size:14.5px;font-weight:700}
.l1-card .meta{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-bottom:10px}.l1-card .meta b{color:var(--pri);font-weight:700}
.l1-card .tags{display:flex;flex-wrap:wrap;gap:5px}
.tagline{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--sub);border:1px solid var(--bd)}
.detail-grid{display:grid;grid-template-columns:120px 1fr;gap:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.detail-grid .dk{background:var(--panel2);padding:10px 14px;font-size:12.5px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--bd2)}
.detail-grid .dv{padding:10px 14px;font-size:13px;color:var(--text);border-bottom:1px solid var(--bd2);word-break:break-word}
.detail-grid .dk:last-of-type,.detail-grid .dv:last-of-type{border-bottom:none}
.detail-status{margin:0 0 14px;padding:12px 14px;background:var(--panel2);border-radius:10px;font-size:12.8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-status b{color:var(--text)}
.detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.detail-sub-title{font-size:13px;font-weight:600;margin:18px 0 8px;color:var(--text);display:flex;align-items:center;gap:8px}
.detail-sub-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--pri)}
.detail-sub-wrap{border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:340px}
.detail-sub-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
.detail-sub-table th{background:var(--panel2);padding:9px 12px;text-align:left;color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--bd)}
.detail-sub-table td{padding:9px 12px;border-bottom:1px solid var(--bd2)}
.detail-sub-table tr:last-child td{border-bottom:none}.detail-sub-table tbody tr:hover td{background:var(--panel2)}
.detail-total{margin-top:10px;text-align:right;font-size:12.5px;color:var(--sub);padding:10px 14px;background:var(--panel2);border-radius:8px}
.detail-total b{color:var(--text);font-size:14px;margin:0 4px}
.detail-form-section{margin-top:18px;padding-top:16px;border-top:1px dashed var(--bd)}
.detail-form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.detail-form-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}

.detail-form-wrap{border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:340px;background:var(--panel)}

.detail-form-table th{background:var(--panel2);padding:9px 10px;text-align:left;color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--bd)}

.detail-form-table input,.detail-form-table select{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--text);font-size:12.5px;outline:none;font-family:inherit}
.detail-form-table input:focus,.detail-form-table select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.detail-form-table input[readonly]{background:var(--bd2);color:var(--sub);cursor:not-allowed}
.detail-form-empty{padding:28px;text-align:center;color:var(--mute);font-size:12.5px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;opacity:.08;background:currentColor}
.kpi.k-blue{color:#2563eb}.kpi.k-green{color:#059669}.kpi.k-amber{color:#d97706}.kpi.k-violet{color:#7c3aed}
.kpi-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.kpi-label{font-size:12px;color:var(--sub)}
.kpi-val{font-size:26px;font-weight:700;color:var(--text);margin-top:6px;letter-spacing:-.5px}
.kpi-val small{font-size:13px;color:var(--mute);font-weight:500;margin-left:3px}
.kpi-trend{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;margin-top:8px}
.kpi-trend.up{background:var(--okSoft);color:#047857}.kpi-trend.down{background:var(--dangerSoft);color:#b91c1c}.kpi-trend.flat{background:var(--panel2);color:var(--mute)}
.chart-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chart-filter select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:12.5px;background:var(--panel);color:var(--text);cursor:pointer;outline:none}
.chart-filter .seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.chart-filter .seg button{border:none;background:var(--panel);color:var(--sub);padding:7px 12px;font-size:12.5px;cursor:pointer;transition:all .15s}
.chart-filter .seg button+button{border-left:1px solid var(--bd)}
.chart-filter .seg button.active{background:var(--pri);color:#fff;font-weight:600}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chart-card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);min-width:0}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.chart-head h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.chart-head h3 .ico{width:22px;height:22px;border-radius:6px;background:var(--priSoft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.chart-tip{font-size:11.5px;color:var(--mute);background:var(--panel2);padding:2px 8px;border-radius:999px}
.chart-body{position:relative}.chart-body svg{display:block;width:100%;height:auto}.chart-full{grid-column:1/-1}
.rank-list{display:flex;flex-direction:column;gap:10px}
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--panel2);transition:all .15s}.rank-item:hover{background:var(--priSoft)}
.rank-no{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bd);color:var(--sub);flex-shrink:0}
.rank-item:nth-child(1) .rank-no{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
.rank-item:nth-child(2) .rank-no{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#fff}
.rank-item:nth-child(3) .rank-no{background:linear-gradient(135deg,#b45309,#d97706);color:#fff}
.rank-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-val{font-size:13px;font-weight:700;color:var(--pri)}
.rank-bar{width:80px;height:6px;background:var(--bd);border-radius:3px;overflow:hidden;flex-shrink:0}.rank-bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:3px}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12.8px}
.mini-tbl th{background:var(--panel2);color:var(--sub);font-weight:600;padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);font-size:12px}
.mini-tbl td{padding:9px 12px;border-bottom:1px solid var(--bd2)}.mini-tbl tr:last-child td{border-bottom:none}.mini-tbl tr:hover td{background:var(--panel2)}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;backdrop-filter:blur(2px)}.modal-mask.show{opacity:1;pointer-events:auto}
.modal-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:201;padding:20px;pointer-events:none}.modal-wrap.show{pointer-events:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--sh3);width:100%;max-width:820px;max-height:calc(100vh - 60px);display:flex;flex-direction:column;transform:scale(.95) translateY(10px);opacity:0;transition:all .22s}
.modal-wrap.show .modal{transform:scale(1) translateY(0);opacity:1}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);flex-shrink:0}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--mute);cursor:pointer;width:28px;height:28px;border-radius:6px;transition:all .15s}.modal-x:hover{background:var(--panel2);color:var(--text)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap}
.form-row{margin-bottom:14px}.form-row:last-child{margin-bottom:0}
.form-row label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:500}
.form-row label .req{color:var(--danger)}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--panel2);color:var(--text);font-size:13px;outline:none;transition:all .15s;font-family:inherit}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--pri);background:var(--panel);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-row textarea{resize:vertical;min-height:70px}.form-row input:disabled,.form-row input[readonly]{opacity:.7;cursor:not-allowed;background:var(--bd2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.form-grid .form-row{margin-bottom:0}.form-grid .span2{grid-column:1/-1}
.audit-info{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:13px;line-height:1.9}.audit-info b{color:var(--text)}.audit-info .k{color:var(--mute);display:inline-block;min-width:80px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:#0f172a;color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;box-shadow:var(--sh3);opacity:0;pointer-events:none;transition:all .22s;z-index:300;max-width:80vw}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.back-top{position:fixed;right:26px;bottom:26px;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--panel);color:var(--pri);font-size:17px;cursor:pointer;box-shadow:var(--sh2);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:all .2s;z-index:50}.back-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}.back-top:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
mark{background:#fde68a;color:#78350f;border-radius:3px;padding:0 2px}body.dark mark{background:#a16207;color:#fef3c7}
@media(max-width:1100px){.chart-grid{grid-template-columns:1fr}}
@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;box-shadow:var(--sh2)}.sidebar.collapsed{width:0;border:none}.top-search{width:150px}.user-info{display:none}.content{padding:16px 14px 80px}.form-grid{grid-template-columns:1fr}.modal{max-width:100%}.detail-grid{grid-template-columns:100px 1fr}}
</style>

<script>
/* ============ 日期基准 2026-11-05 ============ */
const BASE_DATE = new Date(2026, 10, 5);
function dateStr(offsetDays){const d=new Date(BASE_DATE);d.setDate(d.getDate()+offsetDays);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fixDateText(s,offset){return String(s).replace(/(20\d{2})-(\d{2})-(\d{2})/g,()=>dateStr(offset));}

/* ============ 菜单数据（标准版）============ */
const RAW = [
/* 产品与配方 */
["产品与配方","物料与产品","物料成品数据","原料、辅料、添加剂、包材的名称、规格、单位、保质期、储存条件（常温/冷藏/冷冻）、过敏原、执行标准、图片与资质附件，成品编码、规格、箱规、保质期、条码、配料表与营养成分、储存与运输条件"],
["产品与配方","物料与产品","计量单位与换算","多计量单位（kg/箱/袋/包）与换算率，支持固定换算与按实际称重的浮动换算"],
["产品与配方","物料与产品","标签模板","标签版本，产品名称，产品批次号，日期，二维码"],
["产品与配方","配方管理","产品配方（多级BOM）","主料、辅料、食品添加剂、包材的配比、用量、得率与损耗率；支持替代料与多级配方展开"],
["产品与配方","配方管理","配方版本与变更","多版本并存、生效/停用切换、变更申请与审批、变更留痕（从A变更B）"],
["产品与配方","配方管理","配方成本","按原料最新价/移动加权价核算标准成本，输出单位成本与成本构成"],
["产品与配方","配方管理","配方权限与保密","配方分级授权、关键字段脱敏、导出审批、水印"],
/* 工艺与标准 */
["工艺与标准","工艺管理","工序库","定义解冻、和面、蒸煮、冷却、杀菌、金检、包装等基础工序：标准工时、岗位、是否必检、工序说明、启停"],
["工艺与标准","工艺管理","工艺路线","按产品绑定工序顺序，拖拽编排；设置工序交接规则与“上工序合格方可流转”控制"],
["工艺与标准","工艺管理","工艺版本管理","工艺版本审批生效、变更影响评估（影响哪些产品与在制工单）"],
/* 计划管理 */
["计划管理","需求与计划","生产计划（MPS）","月度/周计划，按产线与班组产能平衡，输出可执行的生产批次"],
["计划管理","需求与计划","物料需求计划（MRP）","按BOM展开、扣减现有库存与在途、结合采购提前期计算净需求，生成采购建议与领料计划"],
/* 采购管理 */
["采购管理","采购业务","采购申请","MRP建议、库存阈值、部门领用需求多来源发起，按审批后转采购订单"],
["采购管理","采购业务","采购订单","供应商、物料、数量、价格、交期、到货计划；状态：待下单/已下单/部分到货/已收货/已完成/已取消，采购入库"],
["采购管理","采购业务","采购退货","不合格原料退供，关联采购单与检验单，退货出库并冲减库存与应付"],
["采购管理","供应商管理","供应商档案","供应商编号、证照（营业执照/生产许可/检测报告）、供应物料、账期、评级、联系人，收款信息（银行、账户名、账号）"],
["采购管理","供应商管理","合格供应商准入","准入评审、合格名录、资质到期预警、年度复审；未准入供应商不允许下单"],
/* 仓储物流 */
["仓储物流","库存管理","库存现有量","按物料、批次、效期、库位查询；区分可用、锁定（订单/工单占用）、在检、待处理"],
["仓储物流","库存管理","完工入库","生产完工入库、生成批次与箱码、强制录入生产日期与有效期、回写工单产量"],
["仓储物流","库存管理","其他出入库","盘盈盘亏、赠品、样品、内部领用、报废等非采购非销售出入库，需审批"],
["仓储物流","库存管理","调拨与移库","跨仓、跨库位调拨，调拨在途与调入确认"],
["仓储物流","库存管理","库存预警","安全库存上下限、近效期、过期、呆滞四类预警，按物料/仓库配置阈值"],
["仓储物流","库存管理","盘点","盘点方案、盘点任务、盲盘/动态盘点、差异调整与审批"],
["仓储物流","库存管理","箱码与托盘码","箱码、托盘码（GS1）生成、打印、扫码绑定与流转记录，支撑箱级追溯与装车复核"],
["仓储物流","库存管理","仓库、库区与库位","原料库、包材库、半成品库、成品库、冷库、留样库、不合格品隔离区；仓库—库区—库位三级"],
["仓储物流","配送管理","配送线路与排线","线路、客户配送顺序、配送日、车辆载重与装载率"],
["仓储物流","配送管理","车辆与司机","车辆档案、车牌、载重、年检与保险到期；司机驾照、绑定车辆、配送端权限"],
["仓储物流","配送管理","配送任务与签收","任务下发、导航、送达照片、电子签收、拒收/延期异常上报、历史配送回放"],
/* 生产管理 */
["生产管理","车间执行","生产排产","可视化排产日历、按产线/班组/时间排工单、产线负荷查看、排产锁定与变更日志"],
["生产管理","车间执行","生产工单","由销售订单/计划生成，绑定产品、配方版本、工艺路线、计划产量、班组与计划开完工时间；审核后方可领料"],
["生产管理","车间执行","班组任务","工单派到班组/个人，APP 查看配方、工艺与任务清单"],
["生产管理","车间执行","生产领料","按工单BOM生成领料单，按批次领料、效期优先、超领审批、扫码核料"],
["生产管理","车间执行","生产退料","余料、包材退库，区分良品/不良品，关联工单回写库存"],
["生产管理","车间执行","生产报工","按工序上报完工数、不良数、工时、设备与操作人，录入工序自检结果"],
["生产管理","车间执行","工序流转与交接","上工序检验合格方可流转，记录工序在制数量与所在工序"],
["生产管理","车间执行","车间生产看板","当日计划完成率、工序进度、在制与异常，车间大屏展示"],
/* 质量管理 */
["质量管理","质检基础","检测项设置","检验指标、标准值、允差、检测方法与判定规则"],
["质量管理","质检基础","缺陷库","不合格缺陷类型与严重等级，供现场判定与统计"],
["质量管理","质检基础","质检方案","检测项组合成检验模板，按物料/产品/工序绑定"],
["质量管理","质检基础","待检任务","按业务单据自动生成质检任务池，检验员接单并录入结果"],
["质量管理","检验执行","来料检验（IQC）","按批次抽检，判定合格/让步接收/退货，结果联动采购入库"],
["质量管理","检验执行","过程检验（IPQC）","首件检验、巡检、CCP 点监控（温度/时间/金属探测）"],
["质量管理","检验执行","成品检验（FQC/OQC）","出厂理化与微生物指标检验、放行审批、按批次出具检验报告"],
["质量管理","检验执行","不合格品与退料处置","返工、让步接收、报废、隔离，处置审批与台账"],
["质量管理","检验执行","留样管理","留样登记、绑定成品批次、留样数量与到期日、存放位置、到期提醒、领用销毁、台账打印"],
["质量管理","追溯与召回","产品追溯","正向：工单→领料批次→成品批次→出库→客户；反向：客户/批次→原料供应商批次、检验记录、人员、设备；支持台账导出与溯源二维码"],
["质量管理","追溯与召回","召回管理","召回启动、影响批次锁定冻结、客户与渠道通知、召回数量与处置、监管上报记录"],
["质量管理","食安管理","检验报告与合格证","按批次出具出厂检验报告/合格证，客户端可查询下载"],

const PRODUCT_POOL = ["奶油面包","全麦吐司","芝士蛋糕","椰蓉餐包","牛角可颂","红豆面包","肉松吐司","抹茶蛋糕"];
const SPEC_POOL = ["80g/个","400g/条","250g/盒","60g/个","70g/个","85g/个","450g/条","200g/盒"];
const PRICE_POOL = [3.5,2.5,6.0,2.8,3.2,3.0,3.8,5.5];
const QTY_POOL = [50,100,80,200,120,150,60,90];
const SO_CUSTOMERS = ["味美轩餐饮","鲜果到家","城市配送中心","金鼎食品店","海纳贸易","幸福烘焙"];
const SO_ADDRESSES = ["厦门市思明区湖滨南路 100 号","厦门市湖里区金尚路 200 号","厦门市思明区厦禾路 88 号","厦门市集美区杏林湾路 66 号","厦门市海沧区滨湖北路 9 号","厦门市同安区祥平街道 128 号"];
const SO_USERS = ["张三","李四","王五","赵六","钱七"];
const SO_TIMES = ["09:00-12:00","13:00-17:00","08:00-10:00","14:00-16:00","10:00-12:00","15:00-18:00"];
const SO_STATUS = ["待确认","待生产","生产中","已出库","配送中","已完成"];

function ensureData(row){
  if (state.data[row.id]) return state.data[row.id];
  const tpl = getTpl(row);
  const count = 15 + (row.id % 8);
  const list = [];
  const statuses = ["pending","approved","rejected","pending","approved","done","pending","approved"];
  for (let i = 0; i < count; i++){
    const hh = String(8+(i%10)).padStart(2,"0");
    const mm = String((i*7)%60).padStart(2,"0");
    const item = { id: row.id*10000+i, _status: statuses[i%statuses.length], _created: `2026-11-05 ${hh}:${mm}:00` };
    if (isSalesOrder(row)){
      item.customer = SO_CUSTOMERS[i%SO_CUSTOMERS.length];
      item.deliveryDate = dateStr(i);
      item.orderDate = dateStr(i-1);
      item.deliveryTime = SO_TIMES[i%SO_TIMES.length];
      item.address = SO_ADDRESSES[i%SO_ADDRESSES.length];
      item.orderUser = SO_USERS[i%SO_USERS.length];
      item.orderTime = `2026-11-05 ${hh}:${mm}`;
      item.status = SO_STATUS[i%SO_STATUS.length];
      const detailCount = 2 + (i%4);
      const details = [];
      for (let j = 0; j < detailCount; j++){
        const pi = (i+j) % PRODUCT_POOL.length;
        const qty = QTY_POOL[pi]; const price = PRICE_POOL[pi];
        const subtotal = Number((qty*price).toFixed(2));
        details.push({product:PRODUCT_POOL[pi],spec:SPEC_POOL[pi],qty,unit:"箱",price,subtotal,remark:""});
      }
      item.details = details;
      list.push(item);
      continue;
    }
    tpl.f.forEach(f => {
      if (f.auto) item[f.k] = genCode(f.auto,i);
      else if (f.t === "date") item[f.k] = dateStr(i);
      else if (f.demo){ let v=f.demo[i%f.demo.length]; if(typeof v==="string") v=fixDateText(v,i); item[f.k]=v; }
      else if (f.t === "number") item[f.k] = (i+1)*10;
      else item[f.k] = "示例"+(i+1);
    });
    list.push(item);
  }
  state.data[row.id] = list;
  return list;
}

function filteredMenus(){

function buildTree(rows){
  const map = new Map();
  rows.forEach(r => { if(!map.has(r.l1)) map.set(r.l1,new Map()); const m2=map.get(r.l1); if(!m2.has(r.l2)) m2.set(r.l2,[]); m2.get(r.l2).push(r); });
  return map;
}
function renderSidebar(){
  const st = menuNav.scrollTop;
  const rows = filteredMenus(), tree = buildTree(rows);
  if (state.collapsed){
    let html="";
    tree.forEach((_,l1) => { html += `<div class="m1"><div class="m1-h" data-tl1="${esc(l1)}" title="${esc(l1)}"><span class="m1-icon">${esc(l1.slice(0,1))}</span></div></div>`; });
    menuNav.innerHTML = html || '<div class="menu-empty">无匹配</div>';
    return;
  }
  if (!tree.size){ menuNav.innerHTML = '<div class="menu-empty">没有匹配的菜单</div>'; return; }
  const forceOpen = !!state.keyword;
  let html = "";
  tree.forEach((l2map, l1) => {
    const open = forceOpen || state.expandedL1.has(l1);
    const total = Array.from(l2map.values()).reduce((s,a)=>s+a.length,0);
    html += `<div class="m1 ${open?"open":""}"><div class="m1-h" data-tl1="${esc(l1)}"><span class="caret">▸</span><span class="mlabel">${hl(l1)}</span><span class="mcount">${total}</span></div><div class="m1-b">`;
    l2map.forEach((list, l2) => {
      const key = l1+"||"+l2;
      const open2 = forceOpen || state.expandedL2.has(key);
      html += `<div class="m2 ${open2?"open":""}"><div class="m2-h" data-tl2="${esc(key)}"><span class="caret">▸</span><span class="mlabel">${hl(l2)}</span><span class="mcount">${list.length}</span></div><div class="m2-b">`;
      list.forEach(r => { html += `<div class="m3 ${state.activeId===r.id?"active":""}" data-mid="${r.id}"><span class="dot"></span><span class="mlabel">${hl(r.l3)}</span></div>`; });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  });
  menuNav.innerHTML = html;
  menuNav.scrollTop = st;
}

const COLORS = ["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#84cc16","#f97316","#14b8a6"];
function svgBar(data){
  const W=640,H=280,pad={t:28,r:20,b:42,l:48}; const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d.value),1)*1.2; const slot=iW/data.length,bw=slot*0.52;
  let grid=""; for(let i=0;i<=4;i++){const y=pad.t+iH/4*i,v=Math.round(max-max/4*i);grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="currentColor" stroke-opacity=".1" stroke-dasharray="3 3"/><text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="currentColor" opacity=".55">${v}</text>`;}
  let bars=""; data.forEach((d,i)=>{const h=Math.max(2,d.value/max*iH);const x=pad.l+slot*i+(slot-bw)/2;const y=pad.t+iH-h;const color=d.color||COLORS[i%COLORS.length];bars+=`<g><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${color}"><animate attributeName="height" from="0" to="${h}" dur=".7s" fill="freeze"/><animate attributeName="y" from="${pad.t+iH}" to="${y}" dur=".7s" fill="freeze"/></rect><text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".78" font-weight="700">${d.value}</text><text x="${x+bw/2}" y="${H-16}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">${esc(d.label)}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="color:var(--text)">${grid}${bars}</svg>`;
}
function svgLine(data,color="#3b82f6"){
  const W=640,H=280,pad={t:28,r:24,b:42,l:48}; const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d.value),1)*1.2; const step=iW/(data.length-1||1);
  let grid=""; for(let i=0;i<=4;i++){const y=pad.t+iH/4*i,v=Math.round(max-max/4*i);grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="currentColor" stroke-opacity=".1" stroke-dasharray="3 3"/><text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="currentColor" opacity=".55">${v}</text>`;}
  const pts=data.map((d,i)=>({x:pad.l+step*i,y:pad.t+iH-d.value/max*iH,v:d.value,l:d.label}));
  const line=pts.map((p,i)=>(i?"L":"M")+p.x+","+p.y).join(" "); const area=line+` L${pts[pts.length-1].x},${pad.t+iH} L${pts[0].x},${pad.t+iH} Z`;
  const gid="g"+color.replace("#","");
  let dots=""; pts.forEach((p,i)=>{dots+=`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--panel)" stroke="${color}" stroke-width="2.5"><title>${esc(p.l)}：${p.v}</title></circle><text x="${p.x}" y="${H-16}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">${esc(p.l)}</text>`;if(i===0||i===pts.length-1||i===Math.floor(pts.length/2))dots+=`<text x="${p.x}" y="${p.y-11}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".78" font-weight="700">${p.v}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="color:var(--text)"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function svgPie(data){

function svgStacked(data){
  const W=640,H=280,pad={t:28,r:20,b:42,l:48}; const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const slot=iW/data.length,bw=slot*0.55; const totals=data.map(d=>d.values.reduce((s,v)=>s+v,0)); const max=Math.max(...totals,1)*1.2;
  let grid=""; for(let i=0;i<=4;i++){const y=pad.t+iH/4*i,v=Math.round(max-max/4*i);grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="currentColor" stroke-opacity=".1" stroke-dasharray="3 3"/><text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="currentColor" opacity=".55">${v}</text>`;}
  let bars=""; data.forEach((d,i)=>{let acc=0;const x=pad.l+slot*i+(slot-bw)/2;d.values.forEach((v,j)=>{const h=v/max*iH;const y=pad.t+iH-acc-h;const color=COLORS[j%COLORS.length];bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${color}"><animate attributeName="height" from="0" to="${h}" dur=".6s" fill="freeze"/><animate attributeName="y" from="${pad.t+iH}" to="${y}" dur=".6s" fill="freeze"/></rect>`;acc+=h;});bars+=`<text x="${x+bw/2}" y="${H-16}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">${esc(d.label)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="color:var(--text)">${grid}${bars}</svg>`;
}

function getPageSize(id){ return state.pageSize[id] || 10; }
function getCurPage(id){ return state.page[id] || 1; }

function filterRowsForRow(row, tpl){
  const all = state.data[row.id];
  const q = (state.q[row.id] || "").toLowerCase();
  const f = state.fStatus[row.id] || "";
  const so = isSalesOrder(row);
  const dateFrom = state.dateFrom[row.id] || "";
  const dateTo = state.dateTo[row.id] || "";
  return all.filter(r => {
    if (q){
      if (so){ if (!String(r.customer||"").toLowerCase().includes(q)) return false; }
      else {
        const hit = tpl.c.some(c => String(r[c]??"").toLowerCase().includes(q))
          || (r.details && r.details.some(d => JSON.stringify(d).toLowerCase().includes(q)))
          || (STATUS[r._status]||{}).text.includes(q);
        if (!hit) return false;
      }
    }
    if (f && r._status !== f) return false;
    if (so){
      const d = r.deliveryDate || "";
      if (dateFrom && d < dateFrom) return false;
      if (dateTo && d > dateTo) return false;
    }
    return true;
  });
}

/* ============ 表单 ============ */
function fieldHTML(f, v){
  const value = v == null ? "" : v;
  const req = f.req ? `<span class="req">*</span>` : "";
  let inner;
  if (f.t === "select") inner = `<select data-fk="${f.k}"><option value="">请选择</option>${(f.opts||[]).map(o=>`<option value="${esc(o)}" ${value===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.t === "textarea") inner = `<textarea data-fk="${f.k}">${esc(value)}</textarea>`;
  else inner = `<input type="${f.t||"text"}" data-fk="${f.k}" value="${esc(value)}" ${f.auto?"disabled":""}>`;
  return `<div class="form-row"><label>${esc(f.l)} ${req}</label>${inner}</div>`;
}
function formHTML(fields, values){
  if (fields.length < 4) return fields.map(f=>fieldHTML(f,values?values[f.k]:"")).join("");
  return `<div class="form-grid">${fields.map(f=>`<div class="${f.t==="textarea"?"span2":""}">${fieldHTML(f,values?values[f.k]:"")}</div>`).join("")}</div>`;
}
function detailRowHTML(fields, values){
  const tds = fields.map(f => {
    const v = values ? (values[f.k] ?? "") : "";
    let inp;
    if (f.t === "select") inp = `<select data-df="${f.k}"><option value="">选择</option>${(f.opts||[]).map(o=>`<option value="${esc(o)}" ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else if (f.t === "number"){ const ro=(f.k==="subtotal")?"readonly":""; inp=`<input type="number" data-df="${f.k}" value="${esc(v)}" step="any" ${ro}>`; }
    else inp = `<input type="text" data-df="${f.k}" value="${esc(v)}">`;
    return `<td>${inp}</td>`;
  }).join("");
  return `<tr class="detail-row">${tds}<td><button class="btn btn-sm btn-danger" type="button" data-del-detail>删除</button></td></tr>`;
}
function detailFormHTML(detailsTpl, rows){
  const fields = detailsTpl.fields;
  const rowsHtml = (rows&&rows.length) ? rows.map(r=>detailRowHTML(fields,r)).join("") : "";
  return `<div class="detail-form-section"><div class="detail-form-head"><div class="detail-form-title">${esc(detailsTpl.label)} <span class="cnt" id="detCount">${rows?rows.length:0}</span></div><button class="btn btn-sm btn-primary" type="button" id="addDetailRow">＋ 添加明细</button></div><div class="detail-form-wrap"><table class="detail-form-table"><thead><tr>${fields.map(f=>`<th>${esc(f.l)}${f.req?' <span class="req">*</span>':''}</th>`).join("")}<th style="width:60px">操作</th></tr></thead><tbody id="detailRows">${rowsHtml}</tbody></table><div class="detail-form-empty" id="detailEmpty" style="${rows&&rows.length?"display:none":""}">还没有明细，点击右上角「＋ 添加明细」</div></div><div class="detail-total">合计：数量 <b id="detTotalQty">0</b>　金额 <b id="detTotalAmount">0</b> 元</div></div>`;
}
function bindDetailForm(detailsTpl){
  const tbody = document.getElementById("detailRows"); if (!tbody) return;
  const fields = detailsTpl.fields;
  function refreshMeta(){ const rows=tbody.querySelectorAll("tr.detail-row"); const cnt=document.getElementById("detCount"); if(cnt)cnt.textContent=rows.length; const empty=document.getElementById("detailEmpty"); if(empty)empty.style.display=rows.length?"none":"block"; }
  function recalc(){
    let totalQty=0, totalAmount=0;
    tbody.querySelectorAll("tr.detail-row").forEach(tr=>{
      const qty = parseFloat(tr.querySelector('[data-df="qty"]')?.value) || 0;
      const price = parseFloat(tr.querySelector('[data-df="price"]')?.value) || 0;
      const amtEl = tr.querySelector('[data-df="subtotal"]');
      const amt = Number((qty*price).toFixed(2));
      if (amtEl) amtEl.value = amt;
      totalQty += qty; totalAmount += amt;
    });
    const qEl=document.getElementById("detTotalQty"); const aEl=document.getElementById("detTotalAmount");
    if(qEl)qEl.textContent=totalQty; if(aEl)aEl.textContent=fmtMoney(totalAmount);
  }
  const addBtn = document.getElementById("addDetailRow");
  if (addBtn) addBtn.onclick = () => { tbody.insertAdjacentHTML("beforeend", detailRowHTML(fields, null)); refreshMeta(); recalc(); };
  tbody.addEventListener("click", e=>{ const del=e.target.closest("[data-del-detail]"); if(del){del.closest("tr").remove();refreshMeta();recalc();} });
  tbody.addEventListener("input", recalc); tbody.addEventListener("change", recalc);
  refreshMeta(); recalc();
}
function readForm(fields){
  const out = {};
  fields.forEach(f=>{ const el=document.querySelector(`[data-fk="${f.k}"]`); if(!el)return; out[f.k] = f.t==="number"?(el.value===""?"":Number(el.value)):el.value.trim(); });
  return out;
}
function readDetails(){
  const tbody = document.getElementById("detailRows"); if(!tbody)return[];
  const details=[];
  tbody.querySelectorAll("tr.detail-row").forEach(tr=>{
    const obj={}; let hasValue=false;
    tr.querySelectorAll("[data-df]").forEach(el=>{ const k=el.dataset.df; let v=el.value; if(el.type==="number")v=v===""?"":Number(v);else v=String(v).trim(); obj[k]=v; if(v!==""&&v!=null)hasValue=true; });
    if(hasValue)details.push(obj);
  });
  return details;
}
function validateForm(fields,data){ for(const f of fields) if(f.req&&(data[f.k]===""||data[f.k]==null)) return `请填写「${f.l}」`; return null; }

function openFormModal(row, values, isEdit){
  const tpl = getTpl(row);
  const title = isEdit ? `编辑 · ${row.l3}` : `新增 · ${row.l3}`;
  let bodyHtml = formHTML(tpl.f, values || {});
  if (tpl.details) bodyHtml += detailFormHTML(tpl.details, values && values.details ? values.details : []);
  openModal({
    title, body: bodyHtml,
    buttons: [
      { id:"cancel", text:"取消", onClick: closeModal },
      { id:"ok", text: isEdit ? "保存修改" : "确认新增", cls:"btn-primary", onClick: () => {
        const data = readForm(tpl.f);
        const err = validateForm(tpl.f, data);
        if (err){ toast(err); return; }
        let details = null;
        if (tpl.details){
          details = readDetails();
          if (!details.length){ toast("请至少添加一条商品明细"); return; }
          for (let i=0;i<details.length;i++){
            for (const df of tpl.details.fields){
              if (df.req && (details[i][df.k]===""||details[i][df.k]==null)){ toast(`第 ${i+1} 行明细：「${df.l}」不能为空`); return; }
            }
          }
          details.forEach(d=>{ const q=Number(d.qty)||0; const p=Number(d.price)||0; d.subtotal=Number((q*p).toFixed(2)); });
          data.details = details;
        }
        if (isEdit){
          const target = state.data[row.id].find(r=>r.id===values.id);
          if (target) Object.assign(target, data);
          toast("已保存修改");
        } else {
          if (tpl.f.some(f=>f.auto)){ const af=tpl.f.find(f=>f.auto); data[af.k]=data[af.k]||genCode(af.auto,state.data[row.id].length+1000); }
          tpl.f.forEach(f=>{ if(f.t==="date" && !data[f.k]) data[f.k]=dateStr(0); });
          if (isSalesOrder(row)){
            if (!data.orderTime) data.orderTime = `2026-11-05 ${new Date().toTimeString().slice(0,5)}`;
            if (!data.status) data.status = "待确认";
          }
          state.data[row.id].unshift({ id: uid(), _status: "pending", _created: `2026-11-05 ${new Date().toTimeString().slice(0,8)}`, ...data });
          toast("新增成功，状态：待审核");
        }
        closeModal(); renderContent();
      }}
    ]
  });
  if (tpl.details) bindDetailForm(tpl.details);
}

function openAuditModal(row, id){
  const target = state.data[row.id].find(r=>r.id===id); if(!target)return;
  let summary = "";
  if (isSalesOrder(row)){
    summary = `<div><span class="k">订单号：</span><b>${esc(target.code)}</b></div><div><span class="k">客户：</span><b>${esc(target.customer)}</b></div><div><span class="k">配送日期：</span><b>${esc(target.deliveryDate)}</b></div><div><span class="k">明细：</span><b>${(target.details||[]).length} 项</b></div>`;

    body: `<div class="audit-info">${summary}<div><span class="k">当前状态：</span><span class="tag ${STATUS[target._status].cls}">${STATUS[target._status].text}</span></div></div><div class="form-row"><label>审核意见</label><textarea id="auditRemark" placeholder="请输入审核意见（可选）"></textarea></div>`,
    buttons: [
      { id:"cancel", text:"取消", onClick: closeModal },

      { id:"pass", text:"审核通过", cls:"btn-ok", onClick: () => { target._status="approved"; toast("审核通过"); closeModal(); renderContent(); } }

function confirmDelete(ids, row){

    title: "确认删除",

/* ============ 导出 ============ */
function csvEsc(v){ const s=String(v==null?"":v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function exportCSV(row){
  const all = state.data[row.id] || [];
  let head, lines;
  if (isSalesOrder(row)){
    head = ["订单号","客户名称","配送日期","下单日期","配送时间","配送地址","下单人","下单时间","状态","商品名称","规格","数量","单位","单价(元)","小计(元)","备注"];
    lines = [head.map(csvEsc).join(",")];
    all.forEach(r=>{
      if (r.details && r.details.length){
        r.details.forEach(d=>{ lines.push([r.code,r.customer,r.deliveryDate,r.orderDate,r.deliveryTime,r.address,r.orderUser,r.orderTime,r.status,d.product,d.spec,d.qty,d.unit,d.price,d.subtotal,d.remark||""].map(csvEsc).join(",")); });
      } else {
        lines.push([r.code,r.customer,r.deliveryDate,r.orderDate,r.deliveryTime,r.address,r.orderUser,r.orderTime,r.status,"","","","","","",""].map(csvEsc).join(","));
      }
    });
  } else {
    const tpl = getTpl(row);
    head = [...tpl.f.map(f=>f.l), "状态", "创建时间"];
    lines = [head.map(csvEsc).join(",")];
    all.forEach(r=>{ lines.push([...tpl.f.map(f=>r[f.k]??""), (STATUS[r._status]||{}).text||r._status, r._created||""].map(csvEsc).join(",")); });
  }
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `${row.l3}_${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`已导出 CSV（${all.length} 条）`);
}

  if(isChartPage(row))return;

  if(e.target.id==="addBtn"){openFormModal(row,null,false);return;}
  if(e.target.id==="batchAuditBtn"){
    const sel=state.selected[row.id]||new Set(); if(!sel.size){toast("请先勾选记录");return;}
    openModal({title:"批量审核",body:`<div class="audit-info">确认要审核选中的 <b>${sel.size}</b> 条记录吗？</div>`,buttons:[
      {id:"cancel",text:"取消",onClick:closeModal},
      {id:"ok",text:"全部通过",cls:"btn-ok",onClick:()=>{state.data[row.id].forEach(r=>{if(sel.has(r.id))r._status="approved";});toast(`已审核 ${sel.size} 条记录`);closeModal();renderContent();}}
    ]}); return;
  }
  if(e.target.id==="batchDelBtn"){const sel=state.selected[row.id]||new Set();if(!sel.size){toast("请先勾选记录");return;}confirmDelete(Array.from(sel),row);return;}
  if(e.target.id==="exportBtn"){exportCSV(row);return;}
  if(e.target.id==="resetBtn"){state.q[row.id]="";state.fStatus[row.id]="";state.dateFrom[row.id]="";state.dateTo[row.id]="";state.page[row.id]=1;renderContent();return;}

  const detailBtn=e.target.closest("[data-detail]"); if(detailBtn){openDetailModal(row,Number(detailBtn.dataset.detail));return;}
  const editBtn=e.target.closest("[data-edit]"); if(editBtn){const id=Number(editBtn.dataset.edit);const t=state.data[row.id].find(r=>r.id===id);if(t)openFormModal(row,t,true);return;}
  const auditBtn=e.target.closest("[data-audit]"); if(auditBtn&&!auditBtn.disabled){openAuditModal(row,Number(auditBtn.dataset.audit));return;}
  const delBtn=e.target.closest("[data-del]"); if(delBtn){confirmDelete([Number(delBtn.dataset.del)],row);return;}
  const pg=e.target.closest("[data-pg]"); if(pg){state.page[row.id]=Number(pg.dataset.pg);renderContent();return;}

  if(e.target.id==="checkAll"){
    const checked=e.target.checked; const ps=getPageSize(row.id),cur=getCurPage(row.id);
    const filtered = filterRowsForRow(row, getTpl(row));
    const pageRows = filtered.slice((cur-1)*ps,cur*ps);
    if(!state.selected[row.id])state.selected[row.id]=new Set();
    pageRows.forEach(r=>checked?state.selected[row.id].add(r.id):state.selected[row.id].delete(r.id));
    renderContent(); return;
  }
  const chk=e.target.closest("[data-check]");
  if(chk){const id=Number(chk.dataset.check);if(!state.selected[row.id])state.selected[row.id]=new Set();if(chk.checked)state.selected[row.id].add(id);else state.selected[row.id].delete(id);renderContent();return;}

  const tr=e.target.closest("tr[data-row-id]");
  if(tr&&!e.target.closest("button")&&!e.target.closest("input")&&!e.target.closest(".col-actions")){openDetailModal(row,Number(tr.dataset.rowId));return;}

  const segBtn=e.target.closest("#chartSeg button"); if(segBtn){document.querySelectorAll("#chartSeg button").forEach(b=>b.classList.remove("active"));segBtn.classList.add("active");toast("已切换："+segBtn.textContent);return;}
});

contentEl.addEventListener("input", e=>{
  if(state.activeId==null)return;
  const row=MENUS[state.activeId]; if(isChartPage(row))return;
  if(e.target.id==="qInput"){state.q[row.id]=e.target.value.trim();state.page[row.id]=1;renderContent();}
  if(e.target.id==="dateFromInput"){state.dateFrom[row.id]=e.target.value;state.page[row.id]=1;renderContent();}
  if(e.target.id==="dateToInput"){state.dateTo[row.id]=e.target.value;state.page[row.id]=1;renderContent();}
});
contentEl.addEventListener("change", e=>{
  if(state.activeId==null)return;
  const row=MENUS[state.activeId];
  if(isChartPage(row)){ if(e.target.id==="chartDimSel"){state.chartDim[row.id]=e.target.value;renderContent();toast("已切换维度："+e.target.value);} return; }
  if(e.target.id==="fStatus"){state.fStatus[row.id]=e.target.value;state.page[row.id]=1;renderContent();}
  if(e.target.id==="pageSizeSel"){state.pageSize[row.id]=Number(e.target.value);state.page[row.id]=1;renderContent();}
});

const backTop = $("backTop");
backTop.onclick = () => contentEl.scrollTo({top:0,behavior:"smooth"});
contentEl.addEventListener("scroll", () => backTop.classList.toggle("show", contentEl.scrollTop>260));
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(modalWrap.classList.contains("show")){closeModal();return;} if(state.activeId!=null)closeTab(state.activeId); } });

renderAll();
</script>
</body>
</html>
