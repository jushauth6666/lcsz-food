<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>龙巢食品ERP · 后台管理</title>
<style>
:root{--bg:#f1f5f9;--panel:#fff;--panel2:#f8fafc;--text:#0f172a;--sub:#64748b;--mute:#94a3b8;--bd:#e2e8f0;--bd2:#eef2f7;--pri:#2563eb;--pri2:#1d4ed8;--priSoft:#eff6ff;--ok:#10b981;--okSoft:#ecfdf5;--warn:#f59e0b;--warnSoft:#fffbeb;--danger:#ef4444;--dangerSoft:#fef2f2;--info:#0ea5e9;--infoSoft:#f0f9ff;--sb:#0f172a;--sb2:#1e293b;--sbT:#cbd5e1;--sbS:#f8fafc;--sh:0 1px 3px rgba(15,23,42,.08);--sh2:0 8px 24px rgba(15,23,42,.12);--sh3:0 24px 60px rgba(15,23,42,.22);--r:12px}
body.dark{--bg:#0b1220;--panel:#111a2e;--panel2:#0f172a;--text:#e2e8f0;--sub:#94a3b8;--mute:#64748b;--bd:#1e2a44;--bd2:#172036;--pri:#3b82f6;--priSoft:#122a44;--okSoft:#0d2b23;--warnSoft:#2b2211;--dangerSoft:#2b1215;--infoSoft:#0b2233;--sb:#070d1a;--sb2:#0f172a;--sbT:#94a3b8;--sbS:#f1f5f9}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-size:14px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}button{font-family:inherit}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:264px;flex-shrink:0;background:linear-gradient(180deg,#0e1930,#0a111f 70%);box-shadow:inset -1px 0 0 rgba(255,255,255,.04);color:var(--sbT);display:flex;flex-direction:column;transition:width .22s;overflow:hidden}.sidebar.collapsed{width:68px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px;min-height:60px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 16px rgba(212,175,55,.20)}.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand-txt{overflow:hidden;white-space:nowrap}.brand-txt strong{display:block;font-size:15px;font-weight:600;letter-spacing:.6px;color:var(--sbS)}.brand-txt span{display:block;font-size:10.5px;letter-spacing:1.2px;opacity:.5;margin-top:3px}.sidebar.collapsed .brand-txt{display:none}
.side-tools{display:flex;gap:6px;padding:10px 14px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06)}
.mini{flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--sbT);border-radius:7px;padding:6px 4px;font-size:11.5px;cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden}.mini:hover{background:rgba(255,255,255,.14);color:#fff}
.sidebar.collapsed .side-tools{justify-content:center;padding:10px 6px}.sidebar.collapsed .mini{flex:none;font-size:15px;padding:6px 10px}.sidebar.collapsed .mini .txt{display:none}
.menu-nav{flex:1;overflow-y:auto;padding:14px 12px 30px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 12px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 12px),transparent 100%)}.menu-nav::-webkit-scrollbar{width:6px}.menu-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.menu-empty{color:var(--sbT);opacity:.6;font-size:12.5px;padding:24px 12px;text-align:center}
.m1{margin:0 0 1px;border-radius:10px}
.m1-h{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;cursor:pointer;color:#eef3fb;font-weight:500;font-size:13.5px;letter-spacing:.3px;transition:background .18s,color .18s;user-select:none}
.m1-h:hover{background:rgba(255,255,255,.05);color:#fff}
.m1.open>.m1-h{color:#fff;background:transparent}
.mi{flex-shrink:0;display:block}
.m1-h .mi{width:18px;height:18px;color:#7d90ae;transition:color .18s}
.m1-h:hover .mi,.m1.open>.m1-h .mi{color:#9ec1f5}
.mlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret-ico{width:13px;height:13px;flex-shrink:0;opacity:.33;transition:transform .22s,opacity .22s}
.m1.open>.m1-h>.caret-ico{transform:rotate(-90deg);opacity:.62}
.m1-b{display:none;padding:1px 0 8px 4px}.m1.open>.m1-b{display:block}
.m2{margin:1px 0}
.m2-h{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;color:#c6d4e6;font-size:13px;font-weight:400;letter-spacing:.25px;transition:all .18s;user-select:none;border:1px solid transparent}
.m2-h:hover{color:#f1f5f9;background:rgba(255,255,255,.05)}
.m2.open>.m2-h{color:#e8eef9}
.m2.cur>.m2-h{border-color:transparent;background:transparent;color:#e8eef9}
.m2-h .mi{width:16px;height:16px;color:#7d90ae}
.m2.open>.m2-h .mi,.m2.cur>.m2-h .mi{color:#a3bde6}
.m2-b{display:none;padding:2px 0 6px 14px;margin-left:14px;border-left:1px solid rgba(255,255,255,.08)}.m2.open>.m2-b{display:block}
.m3{display:flex;align-items:center;gap:9px;padding:8px 11px;margin:1px 0 1px 2px;border-radius:7px;cursor:pointer;color:#9aabc2;font-size:12.5px;font-weight:400;letter-spacing:.25px;transition:all .15s;border:1px solid transparent}
.m3:hover{color:#e6edf8;background:rgba(255,255,255,.045)}
.m3 .mi{width:15px;height:15px;opacity:.62}
.m3.active{color:#fff;font-weight:500;background:rgba(59,130,246,.18);border-color:transparent;box-shadow:inset 2px 0 0 #3b82f6}
.m3.active .mi{opacity:.95;color:#a8c8ff}
.sidebar.collapsed .m1-h{justify-content:center;padding:12px 0}
.sidebar.collapsed .m1-h .mlabel,.sidebar.collapsed .m1-h .caret-ico{display:none}
.sidebar.collapsed .m1-b{display:none!important}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:60px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20}
.icon-btn{width:34px;height:34px;border-radius:8px;flex-shrink:0;border:1px solid var(--bd);background:var(--panel);color:var(--sub);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s}.icon-btn:hover{background:var(--panel2);color:var(--pri);border-color:var(--pri)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);overflow:hidden;white-space:nowrap;min-width:0}.crumb b{color:var(--text);font-weight:600}.crumb .sep{opacity:.4}
.crumb .lnk{cursor:pointer;border-radius:4px;padding:2px 5px;transition:all .15s}.crumb .lnk:hover{background:var(--priSoft);color:var(--pri)}
.top-search{margin-left:auto;position:relative;width:240px;flex-shrink:0}
.top-search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--bd);border-radius:8px;background:var(--panel2);color:var(--text);font-size:13px;outline:none;transition:all .15s}
.top-search input:focus{border-color:var(--pri);background:var(--panel);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.top-search .s-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.user{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:4px 8px 4px 14px;border-left:1px solid var(--bd);cursor:pointer;border-radius:8px;transition:background .15s}.user:hover{background:var(--panel2)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.user-info{line-height:1.25}.user-info strong{display:block;font-size:12.5px}.user-info span{display:block;font-size:11px;color:var(--mute)}
.tabbar{height:42px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:stretch;padding:0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.tabbar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12.8px;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;flex-shrink:0}.tab:hover{color:var(--text);background:var(--panel2)}.tab.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.t-x{width:16px;height:16px;border-radius:4px;border:none;background:transparent;color:inherit;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.5;transition:all .15s}.t-x:hover{background:rgba(0,0,0,.1);opacity:1}
.tabbar-empty{display:flex;align-items:center;font-size:12px;color:var(--mute);padding:0 6px}
.content{flex:1;overflow-y:auto;padding:20px 22px 80px;scroll-behavior:smooth}.content::-webkit-scrollbar{width:9px}.content::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{margin:0 0 6px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.page-head h2 .badge{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--priSoft);color:var(--pri)}
.page-head p{margin:0;font-size:12.8px;color:var(--sub)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--bd);background:var(--panel);color:var(--sub);padding:7px 14px;border-radius:8px;font-size:12.8px;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}.btn:hover{background:var(--panel2);color:var(--text);border-color:var(--mute)}
.btn-primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btn-primary:hover{background:var(--pri2);border-color:var(--pri2);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}.btn-ok:hover{background:#059669;border-color:#059669;color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}.btn-danger:hover{background:#dc2626;border-color:#dc2626;color:#fff}
.btn-sm{padding:4px 9px;font-size:11.8px;border-radius:6px}.btn:disabled{opacity:.45;cursor:not-allowed}
.dropdown{position:relative;display:inline-block}
.dropdown-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh2);min-width:220px;max-height:360px;overflow-y:auto;padding:6px;z-index:60;display:none}
.dropdown.open .dropdown-menu{display:block}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:7px;font-size:12.8px;color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap}
.dropdown-item:hover{background:var(--priSoft);color:var(--pri)}
.dropdown-item .di-ico{width:18px;text-align:center;color:var(--mute)}
.page-info{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.8px;color:var(--sub);line-height:1.75}
.page-info summary{cursor:pointer;color:var(--text);font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.page-info summary::-webkit-details-marker{display:none}
.page-info summary::before{content:"▸";color:var(--pri);transition:transform .15s;display:inline-block}
.page-info[open] summary::before{transform:rotate(90deg)}
.page-info .pi-body{padding-top:8px}
.page-info .pi-sec{margin-bottom:6px}.page-info .pi-sec:last-child{margin-bottom:0}
.page-info .pi-sec b{color:var(--text)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tb-search{flex:1;min-width:180px;max-width:320px;padding:7px 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--panel2);color:var(--text);outline:none}.tb-search:focus{border-color:var(--pri);background:var(--panel);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.toolbar select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--panel2);color:var(--text);outline:none;cursor:pointer}
.toolbar input[type=date]{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--panel2);color:var(--text);outline:none}
.toolbar input[type=date]:focus{border-color:var(--pri);background:var(--panel);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.toolbar .spacer{flex:1}.toolbar .date-sep{color:var(--mute);font-size:12.5px}
.tbl-wrap{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
.tbl th{background:var(--panel2);color:var(--sub);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:12.5px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd2);vertical-align:middle;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tbody tr{transition:background .12s;cursor:pointer}.tbl tbody tr:hover{background:var(--panel2)}.tbl tbody tr.selected{background:var(--priSoft)}
.tbl tbody tr:last-child td{border-bottom:none}.tbl .empty-row td{text-align:center;color:var(--mute);padding:50px 0;cursor:default}
.tbl .col-check{width:40px;cursor:default}.tbl .col-actions{width:1%;white-space:nowrap;text-align:right;cursor:default}
.tbl input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--pri)}
.tbl tfoot tr td{background:var(--panel2);font-weight:600;border-top:2px solid var(--bd);border-bottom:none;padding:10px 12px;color:var(--text);font-size:12.8px}
.actions{display:inline-flex;gap:3px;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.warn{background:var(--warnSoft);color:#b45309}.tag.success{background:var(--okSoft);color:#047857}.tag.danger{background:var(--dangerSoft);color:#b91c1c}.tag.info{background:var(--infoSoft);color:#0369a1}.tag.muted{background:var(--panel2);color:var(--mute)}
body.dark .tag.warn{color:#fbbf24}body.dark .tag.success{color:#34d399}body.dark .tag.danger{color:#f87171}body.dark .tag.info{color:#38bdf8}
.link-badge{display:inline-flex;align-items:center;gap:2px;margin-left:6px;font-size:10px;padding:1px 6px;border-radius:4px;background:#fee2e2;color:#dc2626;font-weight:700;cursor:pointer;border:1px solid #fecaca;transition:all .15s;vertical-align:middle}
.link-badge:hover{background:#dc2626;color:#fff;border-color:#dc2626}
body.dark .link-badge{background:#3d1a1e;color:#f87171;border-color:#7f1d1d}
body.dark .link-badge:hover{background:#dc2626;color:#fff}
.detail-badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--priSoft);color:var(--pri);margin-left:4px;font-weight:600;vertical-align:middle}
.pager{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;border-top:1px solid var(--bd2);font-size:12.5px;color:var(--sub)}
.pager .pages{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.pager .pg{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--bd);background:var(--panel);border-radius:7px;color:var(--sub);cursor:pointer;font-size:12.5px;transition:all .15s}
.pager .pg:hover{border-color:var(--pri);color:var(--pri)}.pager .pg.active{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.pager .pg:disabled{opacity:.4;cursor:not-allowed}
.pager select{padding:5px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--panel);color:var(--text);font-size:12.5px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px;transition:all .18s}.stat:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.stat-ico{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px}
.s-blue{background:#eff6ff;color:#2563eb}.s-green{background:#ecfdf5;color:#059669}.s-amber{background:#fffbeb;color:#d97706}.s-violet{background:#f5f3ff;color:#7c3aed}
body.dark .s-blue{background:#122a44;color:#60a5fa}body.dark .s-green{background:#0d2b23;color:#34d399}body.dark .s-amber{background:#2b2211;color:#fbbf24}body.dark .s-violet{background:#231a3d;color:#a78bfa}
.stat-num{font-size:22px;font-weight:700;line-height:1.1}.stat-label{font-size:12px;color:var(--sub);margin-top:3px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.section-title h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title h2::before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(#3b82f6,#06b6d4)}
.section-title .sub{font-size:12px;color:var(--mute);font-weight:400;margin-left:4px}
.l1-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.l1-card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:all .18s;box-shadow:var(--sh);position:relative;overflow:hidden}
.l1-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(#3b82f6,#06b6d4);transform:scaleY(0);transform-origin:top;transition:transform .22s}
.l1-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:rgba(59,130,246,.4)}.l1-card:hover::after{transform:scaleY(1)}
.l1-card h3{margin:0 0 8px;font-size:14.5px;font-weight:700}
.l1-card .meta{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-bottom:10px}.l1-card .meta b{color:var(--pri);font-weight:700}
.l1-card .tags{display:flex;flex-wrap:wrap;gap:5px}
.tagline{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--sub);border:1px solid var(--bd);cursor:pointer;transition:all .15s}
.tagline:hover{background:var(--priSoft);color:var(--pri);border-color:rgba(37,99,235,.35)}
.detail-grid{display:grid;grid-template-columns:120px 1fr;gap:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.detail-grid .dk{background:var(--panel2);padding:10px 14px;font-size:12.5px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--bd2)}
.detail-grid .dv{padding:10px 14px;font-size:13px;color:var(--text);border-bottom:1px solid var(--bd2);word-break:break-word}
.detail-grid .dk:last-of-type,.detail-grid .dv:last-of-type{border-bottom:none}
.detail-status{margin:14px 0;padding:12px 14px;background:var(--panel2);border-radius:10px;font-size:12.8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-status b{color:var(--text)}
.detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.detail-sub-title{font-size:13px;font-weight:600;margin:18px 0 8px;color:var(--text);display:flex;align-items:center;gap:8px}
.detail-sub-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--pri)}
.detail-sub-wrap{border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:340px}
.detail-sub-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
.detail-sub-table th{background:var(--panel2);padding:9px 12px;text-align:left;color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--bd)}
.detail-sub-table td{padding:9px 12px;border-bottom:1px solid var(--bd2)}
.detail-sub-table tr:last-child td{border-bottom:none}.detail-sub-table tbody tr:hover td{background:var(--panel2)}
.detail-sub-table .detail-total-row td{background:var(--panel2);font-weight:600;color:var(--text)}
.detail-form-section{margin-top:18px;padding-top:16px;border-top:1px dashed var(--bd)}
.detail-form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.detail-form-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.detail-form-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--pri)}
.detail-form-title .cnt{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--priSoft);color:var(--pri)}
.detail-form-wrap{border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:340px;background:var(--panel)}
.detail-form-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
.detail-form-table th{background:var(--panel2);padding:9px 10px;text-align:left;color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--bd)}
.detail-form-table th .req{color:var(--danger)}
.detail-form-table td{padding:6px 8px;border-bottom:1px solid var(--bd2)}
.detail-form-table input,.detail-form-table select{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--text);font-size:12.5px;outline:none;font-family:inherit}
.detail-form-table input:focus,.detail-form-table select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.detail-form-table input[readonly]{background:var(--bd2);color:var(--sub);cursor:not-allowed}
.detail-form-empty{padding:28px;text-align:center;color:var(--mute);font-size:12.5px}
.detail-total{padding:10px 14px;font-size:13px;color:var(--sub);display:flex;gap:20px;flex-wrap:wrap}
.detail-total b{color:var(--pri);font-weight:700}
.flow-wrap{display:flex;flex-direction:column;gap:16px}
.flow-row{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:18px 22px;box-shadow:var(--sh)}
.flow-row-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.flow-row-title::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(#3b82f6,#06b6d4)}
.flow-nodes{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow-node{background:linear-gradient(135deg,#eff6ff,#e0f2fe);border:1px solid #bfdbfe;border-radius:10px;padding:11px 16px;min-width:110px;text-align:center;font-size:13px;font-weight:500;color:#1e40af;transition:all .15s;position:relative}
.flow-node:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(37,99,235,.18);border-color:#3b82f6}
.flow-node.terminal{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#86efac;color:#15803d}
.flow-node.start{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#fcd34d;color:#92400e}
.flow-node.warn-node{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#fca5a5;color:#991b1b}
body.dark .flow-node{background:linear-gradient(135deg,#122a44,#0e2a3d);border-color:#1e3a5f;color:#60a5fa}
body.dark .flow-node.terminal{background:linear-gradient(135deg,#0d2b23,#0b2e22);border-color:#166534;color:#34d399}
body.dark .flow-node.start{background:linear-gradient(135deg,#2b2211,#3a2d10);border-color:#a16207;color:#fbbf24}
body.dark .flow-node.warn-node{background:linear-gradient(135deg,#2b1215,#3d1a1e);border-color:#991b1b;color:#f87171}
.flow-arrow{color:var(--pri);font-size:16px;font-weight:700;user-select:none;padding:0 2px}
.flow-node-sub{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:3px}
body.dark .flow-node-sub{color:#94a3b8}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;opacity:.08;background:currentColor}
.kpi.k-blue{color:#2563eb}.kpi.k-green{color:#059669}.kpi.k-amber{color:#d97706}.kpi.k-violet{color:#7c3aed}
.kpi-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.kpi-label{font-size:12px;color:var(--sub)}
.kpi-val{font-size:26px;font-weight:700;color:var(--text);margin-top:6px;letter-spacing:-.5px}
.kpi-val small{font-size:13px;color:var(--mute);font-weight:500;margin-left:3px}
.kpi-trend{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;margin-top:8px}
.kpi-trend.up{background:var(--okSoft);color:#047857}.kpi-trend.down{background:var(--dangerSoft);color:#b91c1c}.kpi-trend.flat{background:var(--panel2);color:var(--mute)}
.chart-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chart-filter select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:12.5px;background:var(--panel);color:var(--text);cursor:pointer;outline:none}
.chart-filter .seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.chart-filter .seg button{border:none;background:var(--panel);color:var(--sub);padding:7px 12px;font-size:12.5px;cursor:pointer;transition:all .15s}
.chart-filter .seg button+button{border-left:1px solid var(--bd)}
.chart-filter .seg button.active{background:var(--pri);color:#fff;font-weight:600}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chart-card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);min-width:0}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.chart-head h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.chart-head h3 .ico{width:22px;height:22px;border-radius:6px;background:var(--priSoft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.chart-tip{font-size:11.5px;color:var(--mute);background:var(--panel2);padding:2px 8px;border-radius:999px}
.chart-body{position:relative}.chart-body svg{display:block;width:100%;height:auto}.chart-full{grid-column:1/-1}
.rank-list{display:flex;flex-direction:column;gap:10px}
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--panel2);transition:all .15s}.rank-item:hover{background:var(--priSoft)}
.rank-no{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bd);color:var(--sub);flex-shrink:0}
.rank-item:nth-child(1) .rank-no{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
.rank-item:nth-child(2) .rank-no{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#fff}
.rank-item:nth-child(3) .rank-no{background:linear-gradient(135deg,#b45309,#d97706);color:#fff}
.rank-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-val{font-size:13px;font-weight:700;color:var(--pri)}
.rank-bar{width:80px;height:6px;background:var(--bd);border-radius:3px;overflow:hidden;flex-shrink:0}.rank-bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:3px}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12.8px}
.mini-tbl th{background:var(--panel2);color:var(--sub);font-weight:600;padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);font-size:12px}
.mini-tbl td{padding:9px 12px;border-bottom:1px solid var(--bd2)}.mini-tbl tr:last-child td{border-bottom:none}.mini-tbl tr:hover td{background:var(--panel2)}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;backdrop-filter:blur(2px)}.modal-mask.show{opacity:1;pointer-events:auto}
.modal-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:201;padding:20px;pointer-events:none}.modal-wrap.show{pointer-events:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--sh3);width:100%;max-width:820px;max-height:calc(100vh - 60px);display:flex;flex-direction:column;transform:scale(.95) translateY(10px);opacity:0;transition:all .22s}
.modal-wrap.show .modal{transform:scale(1) translateY(0);opacity:1}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);flex-shrink:0}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--mute);cursor:pointer;width:28px;height:28px;border-radius:6px;transition:all .15s}.modal-x:hover{background:var(--panel2);color:var(--text)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap}
.form-row{margin-bottom:14px}.form-row:last-child{margin-bottom:0}
.form-row label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:500}
.form-row label .req{color:var(--danger)}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--panel2);color:var(--text);font-size:13px;outline:none;transition:all .15s;font-family:inherit}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--pri);background:var(--panel);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-row textarea{resize:vertical;min-height:70px}.form-row input:disabled,.form-row input[readonly]{opacity:.7;cursor:not-allowed;background:var(--bd2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.form-grid .form-row{margin-bottom:0}.form-grid .span2{grid-column:1/-1}
.audit-info{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:13px;line-height:1.9}.audit-info b{color:var(--text)}.audit-info .k{color:var(--mute);display:inline-block;min-width:80px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:#0f172a;color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;box-shadow:var(--sh3);opacity:0;pointer-events:none;transition:all .22s;z-index:300;max-width:80vw}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.back-top{position:fixed;right:26px;bottom:26px;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--panel);color:var(--pri);font-size:17px;cursor:pointer;box-shadow:var(--sh2);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:all .2s;z-index:50}.back-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}.back-top:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
mark{background:#fde68a;color:#78350f;border-radius:3px;padding:0 2px}body.dark mark{background:#a16207;color:#fef3c7}
@media(max-width:1100px){.chart-grid{grid-template-columns:1fr}}
@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;box-shadow:var(--sh2)}.sidebar.collapsed{width:0;border:none}.top-search{width:150px}.user-info{display:none}.content{padding:16px 14px 80px}.form-grid{grid-template-columns:1fr}.modal{max-width:100%}.detail-grid{grid-template-columns:100px 1fr}}

/* 专属样式：产品与物料 */
.pm-layout{display:flex;gap:16px;align-items:flex-start}
.pm-sidebar{width:220px;flex-shrink:0;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-height:600px}
.pm-sidebar h4{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--text)}
.pm-tree{list-style:none;padding:0;margin:0;font-size:13px;color:var(--sub)}
.pm-tree li{margin-bottom:6px}
.pm-tree .node-title{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s}
.pm-tree .node-title:hover{background:var(--panel2);color:var(--text)}
.pm-tree .node-title.active{background:var(--priSoft);color:var(--pri);font-weight:600}
.pm-tree .children{padding-left:20px;margin-top:4px;border-left:1px dashed var(--bd);margin-left:10px}
.pm-main{flex:1;min-width:0}
.pm-search{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:var(--sh)}
.pm-search .f-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.pm-search input,.pm-search select{padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--panel2);color:var(--text);outline:none;font-size:13px;min-width:160px}
.pm-search input:focus,.pm-search select:focus{border-color:var(--pri);background:var(--panel)}
.pm-search .btns{display:flex;gap:8px;margin-top:10px;width:100%}
.switch{position:relative;display:inline-block;width:40px;height:22px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#cbd5e1;transition:.3s;border-radius:22px}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background-color:white;transition:.3s;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input:checked + .slider{background-color:#3b82f6}
input:checked + .slider:before{transform:translateX(18px)}
.table-mini{width:100%;border-collapse:collapse;font-size:13px}
.table-mini th{background:#f8fafc;color:var(--sub);font-weight:600;padding:10px 12px;text-align:center;border:1px solid var(--bd)}
.table-mini td{padding:10px 12px;text-align:center;border:1px solid var(--bd);color:var(--text)}
.table-mini a{color:#2563eb;text-decoration:none;cursor:pointer}
.table-mini a:hover{text-decoration:underline}
.tag-product{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;padding:2px 6px;border-radius:4px;font-size:11px}
.tag-material{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1;padding:2px 6px;border-radius:4px;font-size:11px}
.pm-tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:16px;gap:20px}
.pm-tabs .tab-item{padding:10px 0;font-size:14px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.pm-tabs .tab-item:hover{color:var(--text)}
.pm-tabs .tab-item.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.form-grid-pm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 24px}
.form-grid-pm .f-row{display:flex;align-items:center;gap:12px}
.form-grid-pm .f-row label{width:80px;text-align:right;color:var(--sub);font-size:13px;flex-shrink:0}
.form-grid-pm .f-row label .req{color:var(--danger);margin-right:2px}
.form-grid-pm .f-row input,.form-grid-pm .f-row select{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--panel2);color:var(--text);outline:none}
.form-grid-pm .f-row input:focus,.form-grid-pm .f-row select:focus{border-color:var(--pri);background:var(--panel)}
.form-grid-pm .f-row.span3{grid-column:1/-1}
.form-grid-pm .f-row.span3 textarea{flex:1;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--panel2);color:var(--text);outline:none;resize:vertical;height:60px}

/* 地图图标 */
.map-icon{color:#3b82f6;font-size:14px;margin-left:6px;cursor:pointer;transition:transform .15s;display:inline-block;vertical-align:middle;}
.map-icon:hover{transform:scale(1.2);color:#1d4ed8;}

/* 二维码缩略图 */
.qr-thumb{display:inline-block;vertical-align:middle;background:#fff;border:1px solid var(--bd);border-radius:4px;padding:2px;cursor:zoom-in;transition:transform .15s,border-color .15s}
.qr-thumb:hover{transform:scale(1.1);border-color:var(--pri)}

/* 全局取消粗体：Windows 的微软雅黑只有 Regular / Bold 两档，font-weight ≥500 会被渲染成粗体 */
body,body *{font-weight:400!important}
</style>

<script>
/* ============ 日期基准 2026-11-05 ============ */
const BASE_DATE = new Date(2026, 10, 5);
function dateStr(o){const d=new Date(BASE_DATE);d.setDate(d.getDate()+o);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fixDateText(s,o){return String(s).replace(/(20\d{2})-(\d{2})-(\d{2})/g,()=>dateStr(o));}
function monthStr(o){const d=new Date(BASE_DATE);d.setDate(1);d.setMonth(d.getMonth()-o);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function dateTimeStr(o,h,m,s){return `${dateStr(o)} ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;}

/* ============ 二维码编码器：byte 模式 / EC 级 M / 版本 1-10（自包含，无外部依赖） ============ */
const qrMatrix=(function(){
  const ECC=[10,16,26,18,24,16,18,22,22,26],BLK=[1,1,1,2,2,4,4,4,5,5],
        TOT=[26,44,70,100,134,172,196,242,292,346],
        ALIGN=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const EXP=new Uint8Array(512),LOG=new Uint8Array(256);
  (function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
  const mul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
  function genPoly(n){let g=[1];for(let i=0;i<n;i++){const t=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){t[j]^=g[j];t[j+1]^=mul(g[j],EXP[i]);}g=t;}return g;}
  function rsRem(data,gen){const res=new Array(gen.length-1).fill(0);for(const v of data){const f=v^res[0];res.shift();res.push(0);for(let i=0;i<res.length;i++)res[i]^=mul(gen[i+1],f);}return res;}
  function fmtBits(mask){let rem=mask;for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);return ((mask<<10)|rem)^0x5412;}
  function verBits(v){let rem=v;for(let i=0;i<12;i++)rem=(rem<<1)^((rem>>>11)*0x1F25);return (v<<12)|rem;}
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let ver=0,dataCw=0;
    for(let v=1;v<=10;v++){
      const dc=TOT[v-1]-ECC[v-1]*BLK[v-1];
      const cap=Math.floor((dc*8-(4+(v<10?8:16)))/8);
      if(bytes.length<=cap){ver=v;dataCw=dc;break;}
    }
    if(!ver)return null;
    const bits=[],push=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1);};
    push(4,4);push(bytes.length,ver<10?8:16);
    for(const b of bytes)push(b,8);
    push(0,Math.min(4,dataCw*8-bits.length));
    while(bits.length%8)bits.push(0);
    const data=[];
    for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
    for(let p=0xEC;data.length<dataCw;p^=0xEC^0x11)data.push(p);
    const numBlocks=BLK[ver-1],eccLen=ECC[ver-1],shortLen=Math.floor(dataCw/numBlocks),
          numLong=dataCw%numBlocks,numShort=numBlocks-numLong,gen=genPoly(eccLen);
    const dBlocks=[],eBlocks=[];let ptr=0;
    for(let b=0;b<numBlocks;b++){const len=shortLen+(b>=numShort?1:0);const d=data.slice(ptr,ptr+len);ptr+=len;dBlocks.push(d);eBlocks.push(rsRem(d,gen));}
    const final=[],maxLen=shortLen+(numLong?1:0);
    for(let i=0;i<maxLen;i++)for(let b=0;b<numBlocks;b++)if(i<dBlocks[b].length)final.push(dBlocks[b][i]);
    for(let i=0;i<eccLen;i++)for(let b=0;b<numBlocks;b++)final.push(eBlocks[b][i]);
    const size=ver*4+17,mods=[],fn=[];
    for(let y=0;y<size;y++){mods.push(new Array(size).fill(false));fn.push(new Array(size).fill(false));}
    const set=(x,y,dark)=>{if(x<0||y<0||x>=size||y>=size)return;mods[y][x]=dark;fn[y][x]=true;};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!==2&&d!==4);}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const pos=ALIGN[ver-1];
    for(let i=0;i<pos.length;i++)for(let j=0;j<pos.length;j++){
      const x=pos[j],y=pos[i];
      if((x===6&&y===6)||(x===6&&y===size-7)||(x===size-7&&y===6))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
    if(ver>=7){const vb=verBits(ver);for(let i=0;i<18;i++){const bit=((vb>>i)&1)===1,a=size-11+i%3,b=Math.floor(i/3);set(a,b,bit);set(b,a,bit);}}
    const drawFormat=(mask)=>{const bits=fmtBits(mask),gb=k=>((bits>>k)&1)===1;
      for(let i=0;i<=5;i++)set(8,i,gb(i));
      set(8,7,gb(6));set(8,8,gb(7));set(7,8,gb(8));
      for(let i=9;i<15;i++)set(14-i,8,gb(i));
      for(let i=0;i<8;i++)set(size-1-i,8,gb(i));
      for(let i=8;i<15;i++)set(8,size-15+i,gb(i));
      set(8,size-8,true);
    };
    const maskBit=(m,x,y)=>(m===0?((x+y)%2===0):m===1?(y%2===0):m===2?(x%3===0):m===3?((x+y)%3===0):
      m===4?((Math.floor(x/3)+Math.floor(y/2))%2===0):m===5?(((x*y)%2)+((x*y)%3)===0):
      m===6?((((x*y)%2)+((x*y)%3))%2===0):((((x+y)%2)+((x*y)%3))%2===0));
    const place=(mask)=>{let i=0;
      for(let right=size-1;right>=1;right-=2){
        if(right===6)right=5;
        for(let vert=0;vert<size;vert++){
          for(let j=0;j<2;j++){
            const x=right-j,upward=((right+1)&2)===0,y=upward?size-1-vert:vert;
            if(!fn[y][x]&&i<final.length*8){
              let bit=((final[i>>>3]>>>(7-(i&7)))&1)===1;
              if(maskBit(mask,x,y))bit=!bit;
              mods[y][x]=bit;i++;
            }
          }
        }
      }
    };
    const penalty=()=>{
      let score=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&mods[y][x]===mods[y][x-1])run++;else{if(run>=5)score+=3+(run-5);run=1;}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&mods[y][x]===mods[y-1][x])run++;else{if(run>=5)score+=3+(run-5);run=1;}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=mods[y][x];if(c===mods[y][x+1]&&c===mods[y+1][x]&&c===mods[y+1][x+1])score+=3;}
      const p1="10111010000",p2="00001011101";
      for(let y=0;y<size;y++){let s="";for(let x=0;x<size;x++)s+=mods[y][x]?"1":"0";for(let i=0;i+11<=size;i++){const t=s.substr(i,11);if(t===p1||t===p2)score+=40;}}
      for(let x=0;x<size;x++){let s="";for(let y=0;y<size;y++)s+=mods[y][x]?"1":"0";for(let i=0;i+11<=size;i++){const t=s.substr(i,11);if(t===p1||t===p2)score+=40;}}
      let dark=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(mods[y][x])dark++;
      score+=Math.floor(Math.abs(dark*100/(size*size)-50)/5)*10;
      return score;
    };
    drawFormat(0);
    let bestMask=0,bestScore=Infinity;
    for(let m=0;m<8;m++){place(m);drawFormat(m);const sc=penalty();if(sc<bestScore){bestScore=sc;bestMask=m;}}
    place(bestMask);drawFormat(bestMask);
    return {size,get:(x,y)=>mods[y][x]};
  }
  return {encode};
})();

const qrCache=new Map();
function qrSvg(text){
  if(qrCache.has(text))return qrCache.get(text);
  let svg="";
  try{
    const m=qrMatrix.encode(String(text));
    if(m){
      const q=4,n=m.size,t=n+q*2;let d="";
      for(let y=0;y<n;y++){let x=0;while(x<n){if(m.get(x,y)){let run=1;while(x+run<n&&m.get(x+run,y))run++;d+=`M${x+q} ${y+q}h${run}v1h${-run}z`;x+=run;}else x++;}}
      svg=`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges"><rect width="${t}" height="${t}" fill="#ffffff"/><path d="${d}" fill="#0f172a"/></svg>`;
    }
  }catch(e){svg="";}
  qrCache.set(text,svg);
  return svg;
}
function qrDataURL(text){return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(qrSvg(text));}
function qrThumbHTML(v,size){const s=size||38;return `<img class="qr-thumb" src="${qrDataURL(v)}" alt="二维码" width="${s}" height="${s}" data-qr="${esc(String(v))}" title="点击查看二维码">`;}
function downloadQrPng(v){
  const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=img.width||360;c.height=img.height||360;
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0);
    const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="qrcode.png";
    document.body.appendChild(a);a.click();document.body.removeChild(a);toast("二维码已下载");};
  img.onerror=()=>toast("二维码生成失败");
  img.src=qrDataURL(v);
}
function openQrModal(v){
  openModal({title:"二维码",body:`<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><img src="${qrDataURL(v)}" alt="二维码" width="260" height="260" style="background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px"><div style="font-size:12.5px;color:var(--sub);word-break:break-all;text-align:center;max-width:420px">${esc(String(v))}</div></div>`,buttons:[{id:"qrDownload",text:"下载 PNG",cls:"btn-primary",onClick:()=>downloadQrPng(v)},{id:"close",text:"关闭",onClick:closeModal}]});
}

      for(let j=0;j<dc;j++){const pi=(i+j)%PRODUCT_POOL.length;const q=QTY_POOL[pi];const p=PRICE_POOL[pi];const sub=Number((q*p).toFixed(2));ds.push({product:PRODUCT_POOL[pi],spec:SPEC_POOL[pi],qty:q,unit:"箱",price:p,subtotal:sub,remark:"按客户要求打包"}); totalQty+=q; totalAmt+=sub;}
      item.details=ds;
      item.specQty = totalQty;
      item.totalAmount = totalAmt;
      item.finStatus = ["未结清", "部分结清", "已结清"][i%3];
      list.push(item);continue;
    }
    tpl.f.forEach(f=>{
      if(isDocNoField(f)) item[f.k]=genNumber(f.k, row.l3, i);
      else if(f.t==="date") item[f.k]=dateStr(i);

      else item[f.k]=realText(f,i,row.l3);
    });
    list.push(item);
  }
  state.data[row.id]=list;return list;
}

/* ============ 列表页 ============ */
const getPageSize=id=>state.pageSize[id]||10,getCurPage=id=>state.page[id]||1;
function filterRowsForRow(row,tpl){
  const all=state.data[row.id],q=(state.q[row.id]||"").toLowerCase(),f=state.fStatus[row.id]||"",so=isSalesOrder(row),df=state.dateFrom[row.id]||"",dt=state.dateTo[row.id]||"";
  return all.filter(r=>{
    if(q){
      if(so){if(!String(r.customer||"").toLowerCase().includes(q))return false;}
      else{const hit=tpl.c.some(c=>String(r[c]??"").toLowerCase().includes(q))||(r.details&&r.details.some(d=>JSON.stringify(d).toLowerCase().includes(q)))||(STATUS[r._status]||{}).text.includes(q);if(!hit)return false;}
    }
    if(f&&r._status!==f)return false;
    if(so){const d=r.deliveryDate||"";if(df&&d<df)return false;if(dt&&d>dt)return false;}
    return true;
  });
}

function formatCellValue(f, v) {
  if (v == null || v === "") return "—";
  if (f && f.k === "qr" && /^https?:\/\//.test(String(v))) return qrThumbHTML(v);
  if (f.t === "number" && /金额|价格|成本|单价|工资/.test(f.l)) v = fmtMoney(v);
  let html = esc(v);
  if (f.l && f.l.includes('地址') && v !== '—') {
      html += ` <span class="map-icon" data-address="${esc(v)}">📍</span>`;
  }
  return html;
}

function renderCell(row, field, value){
  const f = getTpl(row).f.find(x=>x.k===field);
  let v = value;
  const link = getLink(row.l3, field);
  const linkHTML = link ? `<span class="link-badge" data-link-l3="${esc(row.l3)}" data-link-k="${esc(field)}" data-link-v="${esc(v)}">关联</span>` : "";
  const displayVal = formatCellValue(f, v);
  return `<td title="${esc(v)}">${f && field===getTpl(row).c[0] ? `<b>${displayVal}</b>` : displayVal}${linkHTML}</td>`;
}

function listPageHTML(row){
  ensureData(row);
  const tpl=getTpl(row),all=state.data[row.id],so=isSalesOrder(row),filtered=filterRowsForRow(row,tpl),

    }

    const tds = displayCols.map(c=>renderCell(row, c, r[c])).join("");
    const st=r._status,si=STATUS[st]||{text:st,cls:"muted"};
    return `<tr class="${sel.has(r.id)?"selected":""}" data-row-id="${r.id}"><td class="col-check"><input type="checkbox" data-check="${r.id}" ${checked}></td>${tds}<td><span class="tag ${si.cls}">${si.text}</span></td><td style="color:var(--sub);font-size:12px">${esc(r._created||"")}</td><td class="col-actions"><div class="actions"><button class="btn btn-sm" data-detail="${r.id}">详情</button><button class="btn btn-sm" data-edit="${r.id}">编辑</button><button class="btn btn-sm btn-ok" data-audit="${r.id}" ${(st==="pending"||st==="rejected")?"":"disabled"}>审核</button><button class="btn btn-sm btn-danger" data-del="${r.id}">删除</button></div></td></tr>`;
  }).join(""):`<tr class="empty-row"><td colspan="${(so?12:displayCols.length+4)}">暂无数据，点击右上角「新增」创建第一条记录</td></tr>`;

  // 底部合计行
  let footHtml = "";

    pageRows.forEach(r => { totalSpecQty += Number(r.specQty)||0; totalAmount += Number(r.totalAmount)||0; });

  } else if (displayCols.length > 0) {
    let colsHtml = "", hasSum = false;
    displayCols.forEach((c, idx) => {
      const f = tpl.f.find(x=>x.k===c);
      if (f && f.t === "number") { colsHtml += `<td><b>${fmtMoney(sumObj[c])}</b></td>`; hasSum = true; }
      else if (idx === 0) { colsHtml += `<td colspan="1" style="text-align:right;color:var(--sub)">本页合计：</td>`; }

  const moreBtns=parseButtons(row.b);
  const moreMenu=moreBtns.length?`<div class="dropdown" id="moreDropdown"><button class="btn" id="moreBtn">更多操作 ▾</button><div class="dropdown-menu">${moreBtns.map((b,i)=>`<div class="dropdown-item" data-more="${esc(b)}" data-idx="${i}"><span class="di-ico">▸</span>${esc(b)}</div>`).join("")}</div></div>`:"";

  ]});}
function confirmDelete(ids,row){openModal({title:"确认删除",body:`<div class="audit-info">确定要删除选中的 <b>${ids.length}</b> 条记录吗？删除后不可恢复。</div>`,buttons:[
  {id:"cancel",text:"取消",onClick:closeModal},
  {id:"ok",text:"确认删除",cls:"btn-danger",onClick:()=>{state.data[row.id]=state.data[row.id].filter(r=>!ids.includes(r.id));if(state.selected[row.id])ids.forEach(x=>state.selected[row.id].delete(x));toast(`已删除 ${ids.length} 条记录`);closeModal();renderContent();}}
]});}

function runMoreAction(name,row){
  const tpl=getTpl(row);
  const demoFn={
    "批量导入":()=>{const input=document.createElement("input");input.type="file";input.accept=".xlsx,.xls,.csv";input.onchange=()=>{const f=input.files[0];if(f)toast(`已选择文件：${f.name}（演示：解析后导入 3 条数据）`);};input.click();},
    "导入导出":()=>{toast("演示：可按模板导出，也可选择文件导入");},
    "导出模板":()=>{downloadCSV(row,tpl);},
    "打印":()=>{toast("演示：调用浏览器打印");setTimeout(()=>window.print(),400);},
    "打印物料卡":()=>{toast("演示：打开打印预览");setTimeout(()=>window.print(),400);},
    "打印配方表":()=>{toast("演示：打开打印预览");setTimeout(()=>window.print(),400);},
    "打印排产表":()=>{toast("演示：打开打印预览");setTimeout(()=>window.print(),400);},
    "导出":()=>{downloadCSV(row,tpl);},
    "生成条码":()=>{toast("演示：已按编码规则生成条码/箱码并校验唯一性");},
    "同步至客户端":()=>{toast("演示：已发布/下架到小程序商城");},
    "一键生成补货建议":()=>{toast("演示：已根据安全库存生成补货采购申请，处理人：龚先生");},
    "发起召回":()=>{toast("演示：已发起召回并冻结相关批次，处理人：龚先生");},
    "重新核算":()=>{toast("演示：已按最新价重新核算标准成本");},
    "运行 MRP":()=>{toast("演示：MRP 运算完成，已生成采购建议与领料计划");},
    "生成采购建议":()=>{toast("演示：已生成采购建议并转采购申请");},
    "生成领料计划":()=>{toast("演示：已按工单生成领料计划");},
    "成本模拟":()=>{toast("演示：按拟定原料价模拟成本变动（不影响正式数据）");}
  };
  if(demoFn[name]){demoFn[name]();return;}
  if(/^(新增|起草|发起|登记|新建|设置|维护|配置|分配|标记|调整|变更|提交|启动|生成|打开)/.test(name)){toast(`演示操作：${name} —— 已模拟执行完成（处理人：龚先生）`);return;}
  if(/^(查询|查看|预览|追踪|回放|下钻|联查|对比|排行|分析|统计|筛选)/.test(name)){toast(`演示操作：${name} —— 已打开对应视图`);return;}
  if(/^(审批|审核|驳回|发布|生效|停用|启用|锁定|解冻|作废|确认|复核|归档|关闭)/.test(name)){toast(`演示操作：${name} —— 已执行（处理人：龚先生）`);return;}
  if(/^(上传|下载|导入|导出|打印|复印|复制|另存|备份|恢复|同步|推送|通知|发送)/.test(name)){toast(`演示操作：${name} —— 已发起`);return;}
  toast(`演示操作：${name}`);
}
function downloadCSV(row,tpl){
  const all=state.data[row.id]||[];const head=[...tpl.f.map(f=>f.l),"状态","创建时间"];const lines=[head.map(csvEsc).join(",")];
  all.forEach(r=>{lines.push([...tpl.f.map(f=>r[f.k]??""),(STATUS[r._status]||{}).text||r._status,r._created||""].map(csvEsc).join(","));});
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`${row.l3}_${Date.now()}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 CSV（${all.length} 条）`);
}
function csvEsc(v){const s=String(v==null?"":v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}

menuNav.addEventListener("click",e=>{
  const m3=e.target.closest("[data-mid]");if(m3){openMenu(Number(m3.dataset.mid));return;}
  const m2=e.target.closest("[data-tl2]");if(m2){const k=m2.dataset.tl2;if(state.expandedL2.has(k))state.expandedL2.delete(k);else state.expandedL2.add(k);renderSidebar();return;}
  const m1=e.target.closest("[data-tl1]");if(m1){const l1=m1.dataset.tl1;if(state.collapsed){state.collapsed=false;sidebarEl.classList.remove("collapsed");state.expandedL1.add(l1);renderSidebar();return;}if(state.expandedL1.has(l1))state.expandedL1.delete(l1);else state.expandedL1.add(l1);renderSidebar();}
});
$("toggleSidebar").onclick=()=>{state.collapsed=!state.collapsed;sidebarEl.classList.toggle("collapsed",state.collapsed);renderSidebar();toast(state.collapsed?"已收起侧边栏":"已展开侧边栏");};
$("expandAll").onclick=()=>{MENUS.forEach(m=>{state.expandedL1.add(m.l1);state.expandedL2.add(m.l1+"||"+m.l2);});if(state.collapsed){state.collapsed=false;sidebarEl.classList.remove("collapsed");}renderSidebar();toast("已展开全部菜单");};
$("collapseAll").onclick=()=>{state.expandedL1.clear();state.expandedL2.clear();renderSidebar();toast("已折叠全部菜单");};
$("search").addEventListener("input",e=>{state.keyword=e.target.value.trim();renderSidebar();});
$("themeBtn").onclick=()=>{document.body.classList.toggle("dark");const d=document.body.classList.contains("dark");$("themeBtn").textContent=d?"☀️":"🌙";toast(d?"已切换到深色主题":"已切换到浅色主题");};
$("userBox").onclick=()=>toast("当前登录账号：龚先生（系统管理员）");
tabbarEl.addEventListener("click",e=>{const c=e.target.closest("[data-close]");if(c){e.stopPropagation();closeTab(Number(c.dataset.close));return;}const t=e.target.closest("[data-tab]");if(t)openMenu(Number(t.dataset.tab));});
crumbEl.addEventListener("click",e=>{
  if(e.target.closest("[data-home]")){goHome();return;}
  const l1=e.target.closest("[data-cl1]");if(l1){state.expandedL1.add(l1.dataset.cl1);renderSidebar();return;}
  const l2=e.target.closest("[data-cl2]");if(l2){const k=l2.dataset.cl2;state.expandedL1.add(k.split("||")[0]);state.expandedL2.add(k);renderSidebar();}
});
contentEl.addEventListener("click",e=>{
  const qrImg = e.target.closest(".qr-thumb");
  if(qrImg){ e.stopPropagation(); openQrModal(qrImg.dataset.qr); return; }
  const ov2 = e.target.closest("[data-ov2]");
  if(ov2){ e.stopPropagation(); const k=ov2.dataset.ov2, parts=k.split("||"), l1=parts[0], l2=parts[1];
    const first=MENUS.find(m=>m.l1===l1&&m.l2===l2);
    if(first){ state.expandedL1.add(l1); state.expandedL2.add(k); openMenu(first.id); } return; }
  const card = e.target.closest("[data-card]");
  if(card){ e.stopPropagation(); const l1=card.dataset.card; const first=MENUS.find(m=>m.l1===l1);
    if(first){ state.expandedL1.add(l1); openMenu(first.id); } return; }
  const linkBadge = e.target.closest(".link-badge");
  if(linkBadge){ e.stopPropagation(); openLinkModal(linkBadge.dataset.linkL3, linkBadge.dataset.linkK, linkBadge.dataset.linkV); return; }
  const pmLink = e.target.closest("[data-pm-detail]");
  if(pmLink){ e.stopPropagation(); openPMDetailModal(Number(pmLink.dataset.pmDetail)); return; }
  const mapIcon = e.target.closest(".map-icon");
  if(mapIcon){ e.stopPropagation(); openMapModal(mapIcon.dataset.address); return; }
  if(e.target.id==="chartRefresh"){renderContent();toast("已刷新图表数据");return;}
  if(e.target.id==="chartExport"){const row=MENUS[state.activeId];const lines=["指标,数值,同比"];["销售收入","毛利","订单数","回款","库存"].forEach((k,i)=>lines.push(`${k},${100+i*20},${(i+1)*2}%`));const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`${row.l3}_${Date.now()}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);toast("图表数据已导出");return;}
  if(e.target.id==="moreBtn"){const d=$("moreDropdown");if(d)d.classList.toggle("open");return;}
  if(e.target.closest("[data-more]")){const item=e.target.closest("[data-more]");const row=MENUS[state.activeId];const d=$("moreDropdown");if(d)d.classList.remove("open");runMoreAction(item.dataset.more,row);return;}
  document.querySelectorAll(".dropdown.open").forEach(d=>{if(!e.target.closest(".dropdown"))d.classList.remove("open");});
  if(state.activeId==null)return;
  const row=MENUS[state.activeId];if(isChartPage(row)||isFlowPage(row)||row.l3==="产品与物料")return;
  if(e.target.id==="addBtn"){openFormModal(row,null,false);return;}
  if(e.target.id==="batchAuditBtn"){const sel=state.selected[row.id]||new Set();if(!sel.size){toast("请先勾选记录");return;}openModal({title:"批量审核",body:`<div class="audit-info">确认要审核选中的 <b>${sel.size}</b> 条记录吗？处理人：龚先生</div>`,buttons:[{id:"cancel",text:"取消",onClick:closeModal},{id:"ok",text:"全部通过",cls:"btn-ok",onClick:()=>{state.data[row.id].forEach(r=>{if(sel.has(r.id))r._status="approved";});toast(`已审核 ${sel.size} 条记录`);closeModal();renderContent();}}]});return;}
  if(e.target.id==="batchDelBtn"){const sel=state.selected[row.id]||new Set();if(!sel.size){toast("请先勾选记录");return;}confirmDelete(Array.from(sel),row);return;}
  if(e.target.id==="exportBtn"){downloadCSV(row,getTpl(row));return;}
  if(e.target.id==="resetBtn"){state.q[row.id]="";state.fStatus[row.id]="";state.dateFrom[row.id]="";state.dateTo[row.id]="";state.page[row.id]=1;renderContent();return;}
  const detailBtn=e.target.closest("[data-detail]");if(detailBtn){openDetailModal(row,Number(detailBtn.dataset.detail));return;}
  const editBtn=e.target.closest("[data-edit]");if(editBtn){const id=Number(editBtn.dataset.edit);const t=state.data[row.id].find(r=>r.id===id);if(t)openFormModal(row,t,true);return;}
  const auditBtn=e.target.closest("[data-audit]");if(auditBtn&&!auditBtn.disabled){openAuditModal(row,Number(auditBtn.dataset.audit));return;}
  const delBtn=e.target.closest("[data-del]");if(delBtn){confirmDelete([Number(delBtn.dataset.del)],row);return;}
  const pg=e.target.closest("[data-pg]");if(pg){state.page[row.id]=Number(pg.dataset.pg);renderContent();return;}
  if(e.target.id==="checkAll"){const checked=e.target.checked,ps=getPageSize(row.id),cur=getCurPage(row.id),filtered=filterRowsForRow(row,getTpl(row)),pageRows=filtered.slice((cur-1)*ps,cur*ps);if(!state.selected[row.id])state.selected[row.id]=new Set();pageRows.forEach(r=>checked?state.selected[row.id].add(r.id):state.selected[row.id].delete(r.id));renderContent();return;}
  const chk=e.target.closest("[data-check]");if(chk){const id=Number(chk.dataset.check);if(!state.selected[row.id])state.selected[row.id]=new Set();if(chk.checked)state.selected[row.id].add(id);else state.selected[row.id].delete(id);renderContent();return;}
  const tr=e.target.closest("tr[data-row-id]");if(tr&&!e.target.closest("button")&&!e.target.closest("input")&&!e.target.closest(".col-actions")){openDetailModal(row,Number(tr.dataset.rowId));return;}
  const segBtn=e.target.closest("#chartSeg button");if(segBtn){document.querySelectorAll("#chartSeg button").forEach(b=>b.classList.remove("active"));segBtn.classList.add("active");toast("已切换："+segBtn.textContent);return;}
});
contentEl.addEventListener("input",e=>{if(state.activeId==null)return;const row=MENUS[state.activeId];if(isChartPage(row)||isFlowPage(row)||row.l3==="产品与物料")return;if(e.target.id==="qInput"){state.q[row.id]=e.target.value.trim();state.page[row.id]=1;renderContent();}if(e.target.id==="dateFromInput"){state.dateFrom[row.id]=e.target.value;state.page[row.id]=1;renderContent();}if(e.target.id==="dateToInput"){state.dateTo[row.id]=e.target.value;state.page[row.id]=1;renderContent();}});
contentEl.addEventListener("change",e=>{if(state.activeId==null)return;const row=MENUS[state.activeId];if(isChartPage(row)){if(e.target.id==="chartDimSel"){state.chartDim[row.id]=e.target.value;renderContent();toast("已切换维度："+e.target.value);}return;}if(isFlowPage(row)||row.l3==="产品与物料")return;if(e.target.id==="fStatus"){state.fStatus[row.id]=e.target.value;state.page[row.id]=1;renderContent();}if(e.target.id==="pageSizeSel"){state.pageSize[row.id]=Number(e.target.value);state.page[row.id]=1;renderContent();}});
const backTop=$("backTop");backTop.onclick=()=>contentEl.scrollTo({top:0,behavior:"smooth"});
contentEl.addEventListener("scroll",()=>backTop.classList.toggle("show",contentEl.scrollTop>260));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(modalWrap.classList.contains("show")){closeModal();return;}if(state.activeId!=null)closeTab(state.activeId);}});

renderAll();
</script>
